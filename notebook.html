<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notebooks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Familjen+Grotesk:wght@400;600&display=swap">
<style>
:root{
  --bg:#EAF1F0; --panel:#DDE9E7; --paper:#FBFDFC; --ink:#17323A; --muted:#5C7A80;
  --line:#C3D6D3; --gill:#D9567E; --gill-soft:#F7D9E3;
  --ui:"Familjen Grotesk",system-ui,sans-serif; --text:"Literata",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#0F1E22;--panel:#14282D;--paper:#1A3037;--ink:#E3EEEC;--muted:#8FAEB3;--line:#26434A;--gill:#F07C9F;--gill-soft:#3A2630}
}
:root[data-theme=dark]{--bg:#0F1E22;--panel:#14282D;--paper:#1A3037;--ink:#E3EEEC;--muted:#8FAEB3;--line:#26434A;--gill:#F07C9F;--gill-soft:#3A2630}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:1px solid var(--line);border-radius:6px;padding:.35rem .7rem}
button:hover{border-color:var(--gill)}
:focus-visible{outline:2px solid var(--gill);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 260px 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside h2{font-size:.95rem;margin:0;padding:1rem 1rem .5rem;font-weight:600}
.list{overflow:auto;flex:1;padding:0 .5rem}
.item{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.5rem .6rem;border-radius:6px;cursor:pointer;text-decoration:none;color:inherit;font-size:.95rem}
.item:hover{background:var(--bg)}
.item.on{background:var(--paper);box-shadow:inset 3px 0 0 var(--gill)}
.item small{color:var(--muted);white-space:nowrap}
.item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{padding:.7rem;border-top:1px solid var(--line);display:flex;gap:.4rem;flex-wrap:wrap}
.foot .add{flex:1;background:var(--gill);color:#fff;border-color:var(--gill)}
main{display:flex;flex-direction:column;min-height:0;background:var(--paper)}
.bar{display:flex;gap:.5rem;align-items:center;padding:.7rem 1.2rem;border-bottom:1px solid var(--line)}
.bar .crumb{color:var(--muted);font-size:.9rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tabs button.on{background:var(--gill-soft);border-color:var(--gill)}
.sheet{flex:1;overflow:auto;padding:1.5rem clamp(1rem,5vw,4rem)}
.sheet>*{max-width:68ch;margin-inline:auto}
#title{width:100%;border:0;background:none;font:600 1.9rem/1.2 var(--text);padding:0 0 .6rem;outline:none}
#body{width:100%;min-height:60vh;border:0;background:none;resize:none;outline:none;font:400 1.05rem/1.75 var(--text)}
.md{font:400 1.05rem/1.75 var(--text)}
.md h1,.md h2,.md h3{font-family:var(--text);line-height:1.25}
.md code{background:var(--panel);padding:.1em .35em;border-radius:4px;font-size:.9em}
.md pre{background:var(--panel);padding:1rem;border-radius:6px;overflow-x:auto}
.md a{color:var(--gill)}
.md blockquote{margin:1em 0;padding-left:1em;border-left:3px solid var(--gill)}
.empty{color:var(--muted);text-align:center;margin-top:20vh}
.status{font-size:.8rem;color:var(--muted)}
.back{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto}
  aside{display:none;border:0}
  .app[data-view=notebooks] #nb,.app[data-view=pages] #pg{display:flex}
  .app[data-view=editor] aside{display:none}
  .app:not([data-view=editor]) main{display:none}
  .back{display:inline-block}
}
@media print{aside,.bar{display:none}.app{display:block}}
</style>
</head>
<body>
<div class="app" id="app" data-view="editor">
  <aside id="nb">
    <h2>Notebooks</h2>
    <div class="list" id="nbList"></div>
    <div class="foot">
      <button class="add" id="addNb">New notebook</button>
      <button id="export" title="Download all notebooks as JSON">Export</button>
      <button id="import" title="Load a JSON backup">Import</button>
      <button id="theme" title="Switch light or dark">Theme</button>
      <input type="file" id="file" accept=".json" hidden>
    </div>
  </aside>
  <aside id="pg">
    <h2 id="pgHead">Pages</h2>
    <div class="list" id="pgList"></div>
    <div class="foot"><button class="add" id="addPg">New page</button></div>
  </aside>
  <main>
    <div class="bar">
      <button class="back" id="back">Back</button>
      <div class="crumb" id="crumb"></div>
      <span class="status" id="status"></span>
      <span class="tabs"><button id="tEdit" class="on">Write</button> <button id="tView">Read</button></span>
      <button id="delPg" title="Delete this page">Delete</button>
    </div>
    <div class="sheet" id="sheet"></div>
  </main>
</div>

<script>
const KEY = "dysolotl-notebooks-v1";
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 9);
let db, mode = "edit", saveTimer;

function load() {
  try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) { db = null; }
  if (!db || !Array.isArray(db.notebooks) || !db.notebooks.length) {
    const p = { id: uid(), title: "Welcome", body: "# Welcome\n\nThis is your first page. Everything you type is saved in this browser.\n\n- Use **New notebook** and **New page** to organise notes\n- Switch to **Read** to see Markdown rendered\n- **Export** makes a backup you can **Import** on another device", updated: Date.now() };
    db = { notebooks: [{ id: uid(), title: "My first notebook", pages: [p] }] };
  }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); $("status").textContent = "Saved"; }
  catch (e) { $("status").textContent = "Could not save (storage blocked)"; }
}
function queueSave() { $("status").textContent = "Saving..."; clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); }

// routing: #/<notebookId>/<pageId>
function route() {
  const [nbId, pgId] = location.hash.replace(/^#\/?/, "").split("/");
  let nb = db.notebooks.find(n => n.id === nbId) || db.notebooks[0];
  let pg = nb.pages.find(p => p.id === pgId) || null;
  if (!pg && !pgId && matchMedia("(min-width:821px)").matches) pg = nb.pages[0] || null;
  return { nb, pg, hasPg: !!pgId };
}
const go = (nb, pg) => { location.hash = "#/" + nb.id + (pg ? "/" + pg.id : ""); };

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src) {
  const out = []; let list = null, code = null;
  const close = () => { if (list) { out.push("</" + list + ">"); list = null; } };
  for (const line of src.split("\n")) {
    if (line.startsWith("```")) { if (code === null) { close(); code = []; } else { out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); code = null; } continue; }
    if (code) { code.push(line); continue; }
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) { close(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); }
    else if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push("<li>" + inline(m[1]) + "</li>"); }
    else if ((m = line.match(/^\s*\d+\.\s+(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push("<li>" + inline(m[1]) + "</li>"); }
    else if ((m = line.match(/^>\s?(.*)/))) { close(); out.push("<blockquote>" + inline(m[1]) + "</blockquote>"); }
    else if (!line.trim()) close();
    else { close(); out.push("<p>" + inline(line) + "</p>"); }
  }
  close(); return out.join("\n");
}

function render() {
  const { nb, pg, hasPg } = route();
  const app = $("app");
  app.dataset.view = pg && (hasPg || matchMedia("(min-width:821px)").matches) ? "editor" : (location.hash.split("/")[1] ? "pages" : "notebooks");

  $("nbList").innerHTML = db.notebooks.map(n =>
    `<a class="item ${n.id === nb.id ? "on" : ""}" href="#/${n.id}"><span>${esc(n.title)}</span><small>${n.pages.length}</small></a>`).join("");
  $("pgHead").textContent = nb.title;
  $("pgList").innerHTML = nb.pages.length ? nb.pages.map(p =>
    `<a class="item ${pg && p.id === pg.id ? "on" : ""}" href="#/${nb.id}/${p.id}"><span>${esc(p.title || "Untitled")}</span></a>`).join("")
    : '<p class="empty" style="margin-top:2rem">No pages yet.</p>';

  const sheet = $("sheet");
  $("crumb").textContent = pg ? nb.title + " / " + (pg.title || "Untitled") : nb.title;
  $("delPg").style.visibility = $("tEdit").style.visibility = $("tView").style.visibility = pg ? "visible" : "hidden";
  if (!pg) { sheet.innerHTML = '<p class="empty">Pick a page, or create a new one.</p>'; return; }

  $("tEdit").classList.toggle("on", mode === "edit");
  $("tView").classList.toggle("on", mode === "view");
  if (mode === "edit") {
    sheet.innerHTML = '<input id="title" placeholder="Untitled" aria-label="Page title"><textarea id="body" placeholder="Start writing. Markdown works." aria-label="Page text"></textarea>';
    $("title").value = pg.title; $("body").value = pg.body;
    const fit = () => { const b = $("body"); b.style.height = "auto"; b.style.height = Math.max(b.scrollHeight, innerHeight * .6) + "px"; };
    fit();
    $("title").oninput = e => { pg.title = e.target.value; pg.updated = Date.now(); $("crumb").textContent = nb.title + " / " + (pg.title || "Untitled"); queueSave(); };
    $("body").oninput = e => { pg.body = e.target.value; pg.updated = Date.now(); fit(); queueSave(); };
    $("title").onblur = () => renderLists();
  } else {
    sheet.innerHTML = `<article class="md"><h1>${esc(pg.title || "Untitled")}</h1>${md(pg.body)}</article>`;
  }
}
function renderLists() {
  const { nb, pg } = route();
  $("pgList").innerHTML = nb.pages.map(p =>
    `<a class="item ${pg && p.id === pg.id ? "on" : ""}" href="#/${nb.id}/${p.id}"><span>${esc(p.title || "Untitled")}</span></a>`).join("");
}

$("addNb").onclick = () => {
  const title = prompt("Notebook name"); if (!title) return;
  const nb = { id: uid(), title: title.trim(), pages: [] }; db.notebooks.push(nb); save(); go(nb);
};
$("addPg").onclick = () => {
  const { nb } = route();
  const pg = { id: uid(), title: "", body: "", updated: Date.now() };
  nb.pages.push(pg); mode = "edit"; save(); go(nb, pg);
  setTimeout(() => $("title") && $("title").focus(), 50);
};
$("delPg").onclick = () => {
  const { nb, pg } = route(); if (!pg || !confirm('Delete "' + (pg.title || "Untitled") + '"?')) return;
  nb.pages = nb.pages.filter(p => p !== pg); save(); go(nb);
};
$("tEdit").onclick = () => { mode = "edit"; render(); };
$("tView").onclick = () => { mode = "view"; render(); };
$("back").onclick = () => { const { nb } = route(); go(nb); };
$("theme").onclick = () => {
  const dark = document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme:dark)").matches);
  document.documentElement.dataset.theme = dark ? "light" : "dark";
};
$("export").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: "application/json" }));
  a.download = "notebooks-backup.json"; a.click(); URL.revokeObjectURL(a.href);
};
$("import").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.notebooks)) throw 0;
    if (confirm("Replace everything in this browser with the backup?")) { db = data; save(); location.hash = ""; render(); }
  } catch (err) { alert("That file is not a notebooks backup."); }
  e.target.value = "";
};
addEventListener("hashchange", render);
addEventListener("resize", render);
load(); render();
</script>
</body>
</html>
