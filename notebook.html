<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Notebooks</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 24px;
            background: #f5f6f8;
            color: #222;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .topbar a { color: #0066ff; text-decoration: none; font-size: 14px; }
        .user-email { font-size: 14px; color: #666; margin-right: 12px; }
        #logout-btn {
            padding: 8px 16px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        #create-notebook-form {
            background: white;
            padding: 24px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        #create-notebook-form h3 { margin-top: 0; }
        input[type="text"], textarea {
            display: block;
            width: 100%;
            padding: 10px 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
        }
        textarea { resize: vertical; }
        input[type="file"] { margin: 10px 0; font-size: 14px; }
        #save-notebook-btn {
            padding: 10px 20px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
        }
        #save-notebook-btn:hover { background: #0052cc; }
        #save-notebook-btn:disabled { background: #99b8ff; cursor: not-allowed; }
        .notebook {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .notebook-title { font-weight: 600; font-size: 1.15em; margin-bottom: 6px; }
        .notebook-content { white-space: pre-wrap; line-height: 1.5; color: #333; }
        .notebook img {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 14px;
            border: 1px solid #eee;
        }
        .notebook-meta {
            font-size: 0.8em;
            color: #999;
            margin-top: 14px;
            border-top: 1px solid #f0f0f0;
            padding-top: 10px;
        }
        #notebooks-list > p { color: #777; }
    </style>
</head>
<body>
    <div class="topbar">
        <div>
            <a href="index.html">← Home</a>
        </div>
        <div>
            <span class="user-email" id="user-email"></span>
            <button id="logout-btn">Log Out</button>
        </div>
    </div>

    <h1>Team Notebooks</h1>

    <div id="create-notebook-form">
        <h3>Create a New Entry</h3>
        <input type="text" id="notebook-title" placeholder="Title" required>
        <textarea id="notebook-content" rows="4" placeholder="Write your notes here..."></textarea>
        <input type="file" id="notebook-image" accept="image/*">
        <button id="save-notebook-btn">Save Notebook</button>
    </div>

    <div id="notebooks-list">
        <p>Loading…</p>
    </div>

    <script src="supabaseClient.js"></script>
    <script>
        const userEmailSpan = document.getElementById('user-email');
        const logoutBtn = document.getElementById('logout-btn');
        const saveBtn = document.getElementById('save-notebook-btn');
        const titleInput = document.getElementById('notebook-title');
        const contentInput = document.getElementById('notebook-content');
        const imageInput = document.getElementById('notebook-image');
        const listDiv = document.getElementById('notebooks-list');

        let currentUser = null;

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = session.user;
            userEmailSpan.textContent = currentUser.email;

            await loadNotebooks();
            subscribeToNotebookChanges();
        }

        logoutBtn.addEventListener('click', async () => {
            await sb.auth.signOut();
            window.location.href = 'login.html';
        });

        async function loadNotebooks() {
            const { data, error } = await sb
                .from('notebooks')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error loading notebooks:', error);
                listDiv.innerHTML = '<p>Failed to load notebooks: ' + error.message + '</p>';
                return;
            }
            renderNotebooks(data);
        }

        function renderNotebooks(notebooks) {
            listDiv.innerHTML = '';
            if (!notebooks || notebooks.length === 0) {
                listDiv.innerHTML = '<p>No notebooks yet. Create one above!</p>';
                return;
            }
            notebooks.forEach(nb => {
                const div = document.createElement('div');
                div.className = 'notebook';
                div.innerHTML = `
                    <div class="notebook-title">${escapeHtml(nb.title)}</div>
                    <div class="notebook-content">${escapeHtml(nb.content || '')}</div>
                    ${nb.image_url ? `<img src="${nb.image_url}" alt="Notebook image">` : ''}
                    <div class="notebook-meta">${new Date(nb.created_at).toLocaleString()}</div>
                `;
                listDiv.appendChild(div);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        saveBtn.addEventListener('click', async () => {
            const title = titleInput.value.trim();
            const content = contentInput.value.trim();
            const file = imageInput.files[0];

            if (!title) {
                alert('Please enter a title.');
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving…';

            let imageUrl = null;

            try {
                if (file) {
                    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
                    const filePath = `${currentUser.id}/${Date.now()}_${safeName}`;

                    const { error: uploadError } = await sb.storage
                        .from('notebook-images')
                        .upload(filePath, file);

                    if (uploadError) throw uploadError;

                    const { data: urlData } = sb.storage
                        .from('notebook-images')
                        .getPublicUrl(filePath);
                    imageUrl = urlData.publicUrl;
                }

                const { error: dbError } = await sb
                    .from('notebooks')
                    .insert({
                        user_id: currentUser.id,
                        title: title,
                        content: content,
                        image_url: imageUrl
                    });

                if (dbError) throw dbError;

                titleInput.value = '';
                contentInput.value = '';
                imageInput.value = '';

                await loadNotebooks();

            } catch (err) {
                console.error('Failed to save notebook:', err);
                alert('Failed to save: ' + err.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Notebook';
            }
        });

        function subscribeToNotebookChanges() {
            sb.channel('notebook-updates')
                .on(
                    'postgres_changes',
                    { event: '*', schema: 'public', table: 'notebooks' },
                    () => { loadNotebooks(); }
                )
                .subscribe();
        }

        init();
    </script>
</body>
</html>
