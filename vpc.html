<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Value Proposition Canvas - PermaFungi</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ---------- Site-wide theme (matches index/notebook) ---------- */
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #f5f6f8;
            color: #222;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            padding: 24px;
        }

        h1 {
            font-size: clamp(24px, 3vw, 32px);
            font-weight: 600;
            margin: 0 0 6px;
            text-align: center;
        }

        .hint {
            color: #666;
            font-size: 14px;
            margin: 0 0 24px;
            line-height: 1.5;
            text-align: center;
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ---------- Top bar (matches other pages) ---------- */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .topbar a {
            color: #0066ff;
            text-decoration: none;
            font-size: 14px;
        }

        .topbar a:hover {
            text-decoration: underline
        }

        .topbar .right {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap
        }

        .user-email {
            font-size: 14px;
            color: #666
        }

        #logout-btn {
            padding: 8px 16px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #222;
        }

        #logout-btn:hover {
            background: #eee
        }

        /* ---------- Sync pill ---------- */
        .sync {
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 6px;
            background: white;
            padding: 5px 10px;
            border-radius: 999px;
            border: 1px solid #e3e5e8;
        }

        .sync .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #bbb;
            transition: background .2s
        }

        .sync.saving .dot {
            background: #f0a500
        }

        .sync.saved .dot {
            background: #19a974
        }

        .sync.error .dot {
            background: #d33
        }

        /* ---------- Layout ---------- */
        .wrap {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr));
            gap: 24px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* ---------- Head strip ("Value Proposition" bar) ---------- */
        .head {
            display: flex;
            align-items: center;
            gap: 12px;
            background: white;
            padding: 14px 16px;
            min-height: 64px;
            margin-bottom: 16px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            font-size: 13px;
            color: #666;
            font-weight: 500;
        }

        .note,
        .head span {
            font-family: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
            color: #111;
            text-transform: none
        }

        .head span {
            background: #ffb85c;
            border: 1.5px solid #222;
            padding: 6px 10px;
            font-size: 14px;
            outline: none;
            flex: 1;
            max-width: 280px;
            text-align: center;
            box-shadow: 1px 2px 0 rgba(0, 0, 0, .25);
        }

        /* ---------- Zoom bar ---------- */
        .zoombar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 0 auto 24px;
            max-width: 1360px;
        }

        .zoombar .label {
            font-size: 14px;
            color: #666;
            font-weight: 500;
            margin-right: 2px;
        }

        .zoombar button {
            font: inherit;
            font-size: 14px;
            padding: 7px 14px;
            border-radius: 999px;
            border: 1px solid #ccc;
            background: white;
            color: #333;
            cursor: pointer;
        }

        .zoombar button:hover {
            border-color: #999
        }

        .zoombar button.active {
            background: #222;
            border-color: #222;
            color: #fff;
        }

        /* ---------- Canvas card ---------- */
        .canvas-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            padding: 16px;
        }

        /* The canvas stays a square. Notes, labels and tiles are sized in container
           units, so when the board gets wider (zoom buttons, or one canvas per row)
           everything inside it is drawn bigger too — the classic look, just zoomed in. */
        .board {
            container-type: inline-size;
            position: relative;
            width: 100%;
            max-width: 720px;
            aspect-ratio: 1;
            margin: 0 auto;
        }

        .board svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .sq {
            background: var(--panel, #fff);
            border: 3px solid #111;
        }

        .circ {
            background: var(--panel, #fff);
            border: 3px solid #111;
            border-radius: 50%;
        }

        .zone {
            position: absolute;
            display: flex;
            flex-direction: column;
            padding: 4px;
            padding: .7cqw;
            overflow: visible;
        }

        /* Value Proposition square: products on the left, gains/pains right.
           Heights are minimums, so a zone with many notes simply grows. */
        .board.sq .zone[data-l="ps"] { left: 3%; top: 30%; width: 27%; min-height: 40%; }

        .board.sq .zone[data-l="gc"] { left: 40%; top: 4%; width: 56%; min-height: 38%; }

        .board.sq .zone[data-l="pr"] { left: 40%; top: 58%; width: 56%; min-height: 38%; }

        /* Customer Segment circle: jobs on the right, gains/pains left */
        .board.circ .zone[data-l="ga"] { left: 17%; top: 12%; width: 38%; min-height: 33%; }

        .board.circ .zone[data-l="jo"] { left: 66%; top: 31%; width: 29%; min-height: 38%; }

        .board.circ .zone[data-l="pa"] { left: 17%; top: 55%; width: 38%; min-height: 33%; }

        .zone h2 {
            font-size: 13px;
            font-size: 1.9cqw;
            font-weight: 600;
            color: #333;
            margin: 0 0 4px;
            margin-bottom: .7cqw;
            text-align: center;
            font-family: inherit;
            text-transform: none;
            letter-spacing: 0.01em;
        }

        /* ---------- Sticky notes ---------- */
        .notes {
            list-style: none;
            margin: 0;
            padding: 2px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-content: flex-start;
            flex: 1;
            min-height: 0;
            overflow: visible;
        }

        .note {
            position: relative;
            flex: 1 1 84px;
            max-width: 130px;
            min-height: 60px;
            min-width: 0;
            background: var(--n);
            border: 1.5px solid #222;
            box-shadow: 1px 2px 0 rgba(0, 0, 0, .2);
            padding: 6px;
            font-size: 14px;
            line-height: 1.3;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* container units: same shapes, but they grow with the zoomed board */
        .note {
            flex-basis: 12cqw;
            max-width: 18cqw;
            min-height: 7.2cqw;
            padding: 1.2cqw;
            font-size: 2cqw;
        }

        .note span {
            outline: none;
            display: block;
            width: 100%;
            word-break: break-word;
        }

        .note span:empty::before {
            content: "typ hier";
            opacity: .45
        }

        .note button {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1px solid #222;
            background: #fff;
            color: #a00;
            font-size: 13px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
            display: none;
        }

        .note button {
            top: -.9cqw;
            right: -.9cqw;
            width: 2.6cqw;
            height: 2.6cqw;
            font-size: 1.9cqw;
        }

        .note:hover button,
        .note:focus-within button {
            display: block
        }

        .tile {
            flex: 0 0 84px;
            height: 60px;
            border: 1.5px dashed #999;
            background: none;
            color: #999;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
        }

        .tile {
            flex-basis: 12cqw;
            height: 7.2cqw;
            font-size: 3.4cqw;
        }

        .tile:hover,
        .tile:focus-visible {
            color: #111;
            border-color: #111
        }

        [data-c="y"] {
            --n: #fde96b
        }

        [data-c="g"] {
            --n: #a8e88a
        }

        [data-c="p"] {
            --n: #f9b4bc
        }

        /* ---------- Bottom bar ---------- */
        .bar {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            max-width: 1360px;
            margin-left: auto;
            margin-right: auto;
            justify-content: center;
        }

        .bar button {
            font: inherit;
            font-size: 14px;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: white;
            color: #a00;
        }

        .bar button:hover {
            background: #fff0f0;
            border-color: #a00
        }

        /* ---------- Zoom levels ---------- */
        .wrap.z-big {
            grid-template-columns: minmax(0, 1fr);
        }

        .wrap.z-big .board {
            max-width: 100%;
        }

        .wrap.z-xl {
            grid-template-columns: minmax(0, 1fr);
            max-width: 2400px;
        }

        .wrap.z-xl .board {
            max-width: 1600px;
        }

        @media (max-width:520px) {
            .wrap,
            .wrap.z-big,
            .wrap.z-xl {
                grid-template-columns: minmax(0, 1fr);
            }

            body {
                padding: 16px
            }
        }
    </style>
</head>

<body data-export-target=".wrap" data-export-name="value-proposition-canvas">

    <div class="topbar" id="topbar" style="display:none">
        <a href="index.html">← Home</a>
        <div class="right">
            <span class="sync" id="sync"><span class="dot"></span><span id="sync-text">Verbonden</span></span>
            <span class="user-email" id="user-email"></span>
            <button type="button" id="logout-btn">Log Out</button>
        </div>
    </div>

    <h1>Value Proposition Canvas</h1>
    <p class="hint">Klik op een sticky note om de tekst aan te passen. Druk op Enter voor een nieuwe note, of gebruik de
        + naast de notes. Met × (bij de muis) verwijder je een note. Wijzigingen worden direct gedeeld met je team.</p>

    <div class="zoombar">
        <span class="label">Zoom</span>
        <button type="button" data-z="fit">Passend</button>
        <button type="button" data-z="big">Groot</button>
        <button type="button" data-z="xl">Extra groot</button>
    </div>

    <div class="wrap" id="canvas-wrap">
        <section>
            <div class="head">
                Value Proposition
                <span contenteditable="true" data-k="vp"></span>
            </div>
            <div class="canvas-card">
                <div class="board sq">
                    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                        <g stroke="#111" stroke-width="0.35" fill="none" vector-effect="non-scaling-stroke">
                            <line x1="0" y1="0" x2="50" y2="50" />
                            <line x1="0" y1="100" x2="50" y2="50" />
                            <line x1="56" y1="50" x2="100" y2="50" />
                        </g>
                        <g stroke="#111" stroke-width="1.4" fill="#fff">
                            <rect x="43" y="46" width="14" height="10" />
                            <rect x="45" y="41" width="10" height="5" />
                        </g>
                    </svg>
                    <div class="zone" data-c="y" data-l="ps"></div>
                    <div class="zone" data-c="g" data-l="gc"></div>
                    <div class="zone" data-c="p" data-l="pr"></div>
                </div>
            </div>
        </section>

        <section>
            <div class="head">
                Customer Segment
                <span contenteditable="true" data-k="cs"></span>
            </div>
            <div class="canvas-card">
                <div class="board circ">
                    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                        <g stroke="#111" stroke-width="0.35" fill="none" vector-effect="non-scaling-stroke">
                            <line x1="0" y1="50" x2="43" y2="50" />
                            <line x1="55" y1="45" x2="90" y2="16" />
                            <line x1="55" y1="55" x2="90" y2="84" />
                        </g>
                        <g stroke="#111" stroke-width="1.4" fill="#fff">
                            <circle cx="49" cy="50" r="6" />
                        </g>
                    </svg>
                    <div class="zone" data-c="g" data-l="ga"></div>
                    <div class="zone" data-c="y" data-l="jo"></div>
                    <div class="zone" data-c="p" data-l="pa"></div>
                </div>
            </div>
        </section>
    </div>

    <div class="bar">
        <button type="button" id="reset">Reset voor hele team</button>
    </div>

    <script src="export-tools.js"></script>
    <script src="supabaseClient.js"></script>
    <script>
        (async () => {
            /* ---------- 1. Auth guard ---------- */
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }

            document.getElementById('topbar').style.display = 'flex';
            document.getElementById('user-email').textContent = session.user.email;
            document.getElementById('logout-btn').addEventListener('click', async () => {
                await sb.auth.signOut();
                window.location.href = 'login.html';
            });

            /* ---------- 2. Labels & defaults ---------- */
            const T = {
                ps: "Producten en diensten", gc: "Gain creators", pr: "Pain relievers",
                ga: "Gains", jo: "Customer jobs", pa: "Pains"
            };

            const DEFAULTS = {
                vp: "Digitaal monitoringssysteem voor de productie",
                cs: "Personeel: productiemedewerkers in Vorst",
                ps: ["Sensoren temperatuur en vochtigheid", "Dashboard met batchoverzicht", "Batchregistratie", "Meldingen en rapportage"],
                gc: ["Minder mislukte batches en afval", "Overzicht op één scherm", "Tijdwinst", "Data om kwaliteit te bewijzen"],
                pr: ["Automatische waarschuwingen", "Minder handmatige controles", "Geschiedenis per batch", "Fouten meteen zien"],
                ga: ["Meteen een melding bij afwijking", "Tijdwinst", "Minder mislukte batches", "Overzicht op één scherm", "Constante kwaliteit"],
                jo: ["Grondstoffen mengen", "Mycelium laten groeien", "Kwaliteit bewaken", "Batches opvolgen"],
                pa: ["Batches mislukken door schimmel", "Veel handmatig controleren", "Geen overzicht van data", "Fouten te laat gemerkt"]
            };

            let S = JSON.parse(JSON.stringify(DEFAULTS));
            let focusedKey = null;
            let focusedIndex = null;

            /* ---------- 2b. Zoom ---------- */
            const ZOOM_KEY = 'vpc-zoom';
            const wrapEl = document.getElementById('canvas-wrap');
            const zoomButtons = document.querySelectorAll('.zoombar button');

            function setZoom(level) {
                wrapEl.classList.remove('z-big', 'z-xl');
                if (level === 'big') wrapEl.classList.add('z-big');
                if (level === 'xl') wrapEl.classList.add('z-xl');
                zoomButtons.forEach(b => b.classList.toggle('active', b.dataset.z === level));
                try { localStorage.setItem(ZOOM_KEY, level); } catch (e) { /* private mode */ }
            }

            zoomButtons.forEach(b => b.addEventListener('click', () => setZoom(b.dataset.z)));
            let savedZoom = 'fit';
            try { savedZoom = localStorage.getItem(ZOOM_KEY) || 'fit'; } catch (e) { /* private mode */ }
            setZoom(savedZoom);

            /* ---------- 4. Sync pill ---------- */
            const syncEl = document.getElementById('sync');
            const syncText = document.getElementById('sync-text');
            function setSync(state, text) {
                syncEl.className = 'sync ' + state;
                syncText.textContent = text;
            }

            /* ---------- 4. Load ---------- */
            async function loadAll() {
                const { data, error } = await sb.from('vpc_state').select('key, value');
                if (error) { setSync('error', 'Laadfout: ' + error.message); return; }

                if (!data || data.length === 0) {
                    const rows = Object.entries(DEFAULTS).map(([key, value]) => ({
                        key, value, updated_by: session.user.id
                    }));
                    const { error: seedErr } = await sb.from('vpc_state').insert(rows);
                    if (seedErr) setSync('error', 'Seed-fout: ' + seedErr.message);
                    else setSync('saved', 'Opgeslagen');
                } else {
                    data.forEach(row => { S[row.key] = row.value; });
                    setSync('saved', 'Opgeslagen');
                }
            }

            /* ---------- 5. Debounced save ---------- */
            const saveTimers = {};
            function queueSave(key) {
                setSync('saving', 'Opslaan…');
                clearTimeout(saveTimers[key]);
                saveTimers[key] = setTimeout(async () => {
                    const { error } = await sb.from('vpc_state').upsert({
                        key, value: S[key],
                        updated_at: new Date().toISOString(),
                        updated_by: session.user.id
                    }, { onConflict: 'key' });
                    if (error) setSync('error', 'Fout: ' + error.message);
                    else setSync('saved', 'Opgeslagen');
                }, 600);
            }

            /* ---------- 6. Render ---------- */
            function focusNote(el, i) {
                const s = el.querySelectorAll(".note span")[i];
                if (s) s.focus();
            }

            function renderZone(el) {
                const k = el.dataset.l;
                el.innerHTML = "";
                const h = document.createElement("h2"); h.textContent = T[k]; el.appendChild(h);
                const ul = document.createElement("ul"); ul.className = "notes"; el.appendChild(ul);

                S[k].forEach(function (t, i) {
                    const li = document.createElement("li"), sp = document.createElement("span"), b = document.createElement("button");
                    li.className = "note"; sp.contentEditable = "true"; sp.textContent = t;

                    sp.addEventListener('focus', () => { focusedKey = k; focusedIndex = i; });
                    sp.addEventListener('blur', () => { focusedKey = null; focusedIndex = null; });

                    sp.oninput = function () { S[k][i] = sp.textContent; queueSave(k); };
                    sp.onkeydown = function (e) {
                        if (e.key === "Enter") {
                            e.preventDefault();
                            S[k].splice(i + 1, 0, ""); queueSave(k);
                            renderZone(el); focusNote(el, i + 1);
                        }
                    };

                    b.textContent = "×"; b.setAttribute("aria-label", "Verwijder note");
                    b.onclick = function () { S[k].splice(i, 1); queueSave(k); renderZone(el); };

                    li.appendChild(sp); li.appendChild(b); ul.appendChild(li);
                });

                const li = document.createElement("li"), a = document.createElement("button");
                a.className = "tile"; a.textContent = "+"; a.setAttribute("aria-label", "Nieuwe note toevoegen");
                a.onclick = function () {
                    S[k].push(""); queueSave(k);
                    renderZone(el); focusNote(el, S[k].length - 1);
                };
                li.appendChild(a); ul.appendChild(li);
            }

            function renderHeader(sp) {
                const k = sp.dataset.k;
                sp.textContent = S[k];
                sp.addEventListener('focus', () => { focusedKey = k; focusedIndex = null; });
                sp.addEventListener('blur', () => { focusedKey = null; focusedIndex = null; });
                sp.oninput = function () { S[k] = sp.textContent; queueSave(k); };
                sp.onkeydown = function (e) {
                    if (e.key === "Enter") { e.preventDefault(); sp.blur(); }
                };
            }

            function renderAll() {
                document.querySelectorAll(".zone").forEach(renderZone);
                document.querySelectorAll(".head span").forEach(renderHeader);
            }

            /* ---------- 7. Realtime ---------- */
            function subscribeRealtime() {
                sb.channel('vpc-updates')
                    .on('postgres_changes',
                        { event: '*', schema: 'public', table: 'vpc_state' },
                        (payload) => {
                            const row = payload.new || payload.old;
                            if (!row || !row.key) return;

                            if (row.updated_by && row.updated_by === session.user.id) {
                                if (JSON.stringify(S[row.key]) !== JSON.stringify(row.value)) {
                                    S[row.key] = row.value;
                                    softRerender(row.key);
                                }
                                return;
                            }

                            S[row.key] = row.value;
                            softRerender(row.key);
                        })
                    .subscribe();
            }

            function softRerender(key) {
                if (focusedKey === key) return;

                if (key === 'vp' || key === 'cs') {
                    const sp = document.querySelector('.head span[data-k="' + key + '"]');
                    if (sp && document.activeElement !== sp) sp.textContent = S[key];
                } else {
                    const zoneEl = document.querySelector('.zone[data-l="' + key + '"]');
                    if (zoneEl) renderZone(zoneEl);
                }
                setSync('saved', 'Bijgewerkt');
            }

            /* ---------- 8. Reset ---------- */
            document.getElementById("reset").onclick = async function () {
                if (!confirm("Weet je zeker dat je de VPC voor het hele team wilt resetten naar de beginwaarden?")) return;

                setSync('saving', 'Resetten…');
                const rows = Object.entries(DEFAULTS).map(([key, value]) => ({
                    key, value,
                    updated_at: new Date().toISOString(),
                    updated_by: session.user.id
                }));
                const { error } = await sb.from('vpc_state').upsert(rows, { onConflict: 'key' });

                if (error) { setSync('error', 'Resetfout: ' + error.message); return; }

                S = JSON.parse(JSON.stringify(DEFAULTS));
                renderAll();
                setSync('saved', 'Gerest');
            };

            /* ---------- 9. Boot ---------- */
            setSync('saving', 'Laden…');
            await loadAll();
            renderAll();
            subscribeRealtime();
        })();
    </script>
</body>

</html>
