<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Value Proposition Canvas - PermaFungi</title>
<style>
:root{--bg:#e4e4e2;--panel:#fff;--ink:#111;--soft:#555;--line:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1b;--panel:#272725;--ink:#ecebe6;--soft:#aaa9a2;--line:#ecebe6}}
:root[data-theme="dark"]{--bg:#1c1c1b;--panel:#272725;--ink:#ecebe6;--soft:#aaa9a2;--line:#ecebe6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif;padding:20px}
h1{font-size:clamp(26px,4vw,40px);font-weight:500;margin:0 0 6px}
.hint{color:var(--soft);font-size:14px;margin:0 0 20px}
.wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:28px;max-width:1200px}
.head{background:var(--panel);padding:8px 10px;min-height:52px;margin-bottom:20px;font-size:13px}
.head b{font-weight:400;color:var(--soft);display:block;font-size:12px}
.head span{font-size:16px;display:block;margin-top:2px}
.board{position:relative;width:100%;max-width:560px;aspect-ratio:1;margin:0 auto}
.board svg{position:absolute;inset:0;width:100%;height:100%}
.sq{background:var(--panel);border:3px solid var(--line)}
.circ{background:var(--panel);border:3px solid var(--line);border-radius:50%}
.zone{position:absolute;display:flex;flex-direction:column;overflow:hidden}
.zone h2{font-size:13px;font-weight:500;margin:0 0 3px;text-align:center}
.zone ul{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:0}
.zone li{display:flex;gap:4px;font-size:11.5px;line-height:1.3;margin-bottom:3px;align-items:flex-start}
.zone li::before{content:"•";color:var(--soft)}
.zone li span{flex:1;outline:none;border-radius:2px;padding:0 2px}
.zone li span:focus,.head span:focus{background:rgba(120,120,120,.2)}
.zone li button{border:0;background:none;color:var(--soft);cursor:pointer;font-size:14px;line-height:1;padding:0 2px;opacity:.5}
.zone li button:hover,.zone li button:focus-visible{opacity:1;color:#c0392b}
.add{border:1px dashed var(--soft);background:none;color:var(--soft);font-size:11px;padding:2px 6px;cursor:pointer;margin:2px auto 0;border-radius:3px}
.add:hover,.add:focus-visible{color:var(--ink);border-color:var(--ink)}
.bar{margin-top:22px}
.bar button{font:inherit;font-size:14px;padding:8px 14px;background:var(--panel);color:var(--ink);border:1px solid var(--line);cursor:pointer}
@media (max-width:520px){.zone li{font-size:10px}.zone h2{font-size:11px}}
</style></head><body>
<h1>The Value Proposition Canvas</h1>
<p class="hint">Klik op een tekst om die aan te passen. Gebruik "+ toevoegen" voor een nieuw punt en × om te verwijderen. Wijzigingen blijven bewaard in je browser.</p>
<div class="wrap">
<section>
<div class="head"><b>Value Proposition:</b><span contenteditable="true" data-k="vp"></span></div>
<div class="board sq">
<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
<g stroke="var(--line)" stroke-width="0.35" fill="none" vector-effect="non-scaling-stroke"><line x1="0" y1="0" x2="50" y2="50"/><line x1="0" y1="100" x2="50" y2="50"/><line x1="56" y1="50" x2="100" y2="50"/></g>
<g stroke="var(--line)" stroke-width="1.4" fill="var(--panel)"><rect x="43" y="46" width="14" height="10"/><rect x="45" y="41" width="10" height="5"/></g>
</svg>
<div class="zone" style="left:4%;top:33%;width:25%;height:34%" data-l="ps"></div>
<div class="zone" style="left:42%;top:5%;width:53%;height:38%" data-l="gc"></div>
<div class="zone" style="left:42%;top:57%;width:53%;height:38%" data-l="pr"></div>
</div>
</section>
<section>
<div class="head"><b>Customer Segment:</b><span contenteditable="true" data-k="cs"></span></div>
<div class="board circ">
<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
<g stroke="var(--line)" stroke-width="0.35" fill="none" vector-effect="non-scaling-stroke"><line x1="0" y1="50" x2="43" y2="50"/><line x1="55" y1="45" x2="90" y2="16"/><line x1="55" y1="55" x2="90" y2="84"/></g>
<g stroke="var(--line)" stroke-width="1.4" fill="var(--panel)"><circle cx="49" cy="50" r="6"/></g>
</svg>
<div class="zone" style="left:18%;top:14%;width:36%;height:30%" data-l="ga"></div>
<div class="zone" style="left:66%;top:32%;width:27%;height:36%" data-l="jo"></div>
<div class="zone" style="left:18%;top:56%;width:36%;height:30%" data-l="pa"></div>
</div>
</section>
</div>
<div class="bar"><button id="reset">Terug naar beginwaarden</button></div>
<script>
var T={ps:"Producten en diensten",gc:"Gain creators",pr:"Pain relievers",ga:"Gains",jo:"Customer jobs",pa:"Pains"};
var D={vp:"Digitaal monitoringssysteem voor de productie",cs:"Personeel: productiemedewerkers in de fabriek in Vorst",
ps:["Sensoren voor temperatuur en vochtigheid","Dashboard met batchoverzicht","Batchregistratie","Meldingen en rapportage"],
gc:["Minder mislukte batches en minder afval","Overzicht van alle batches op één scherm","Tijdwinst door minder handmatig werk","Data om de kwaliteit te bewijzen"],
pr:["Automatische waarschuwingen bij afwijkingen","Minder handmatige controles","Geschiedenis per batch om fouten te vinden","Fouten meteen zien, niet te laat"],
ga:["Meteen een melding bij een afwijking","Minder handmatige controles en tijdwinst","Minder mislukte batches en minder afval","Duidelijk overzicht op één scherm","Vertrouwen in constante kwaliteit"],
jo:["Grondstoffen mengen en kweekruimtes voorbereiden","Mycelium laten groeien onder de juiste omstandigheden","Kwaliteit van elke batch bewaken","Batches opvolgen tot ze droog zijn"],
pa:["Batches mislukken door schimmel of verkeerde temperatuur en vochtigheid","Veel handmatig controleren","Geen overzicht van meetgegevens per batch","Fouten worden te laat gemerkt, hele batch verloren"]};
var S=JSON.parse(JSON.stringify(D)),KEY="vpc-permafungi";
try{var raw=localStorage.getItem(KEY);if(raw){S=Object.assign(S,JSON.parse(raw))}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function zone(el){
var k=el.dataset.l;el.innerHTML="";
var h=document.createElement("h2");h.textContent=T[k];el.appendChild(h);
var ul=document.createElement("ul");el.appendChild(ul);
S[k].forEach(function(t,i){
var li=document.createElement("li"),sp=document.createElement("span"),b=document.createElement("button");
sp.contentEditable="true";sp.textContent=t;
sp.oninput=function(){S[k][i]=sp.textContent;save()};
sp.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();sp.blur()}};
b.textContent="×";b.setAttribute("aria-label","Verwijder punt");
b.onclick=function(){S[k].splice(i,1);save();zone(el)};
li.appendChild(sp);li.appendChild(b);ul.appendChild(li)});
var a=document.createElement("button");a.className="add";a.textContent="+ toevoegen";
a.onclick=function(){S[k].push("Nieuw punt");save();zone(el);var s=el.querySelectorAll("li span");var l=s[s.length-1];l.focus();document.execCommand&&document.execCommand("selectAll")};
el.appendChild(a)}
function build(){
document.querySelectorAll(".zone").forEach(zone);
document.querySelectorAll(".head span").forEach(function(sp){
sp.textContent=S[sp.dataset.k];
sp.oninput=function(){S[sp.dataset.k]=sp.textContent;save()};
sp.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();sp.blur()}}})}
document.getElementById("reset").onclick=function(){S=JSON.parse(JSON.stringify(D));save();build()};
build();
</script></body></html>
