<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekverslag Generator - PermaFungi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: #f5f6f8;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    padding: 24px;
}
h1 { font-size: clamp(24px, 3vw, 32px); font-weight: 600; margin: 0 0 6px; text-align: center; }
.hint { color: #666; font-size: 14px; margin: 0 auto 24px; line-height: 1.5; text-align: center; max-width: 820px; }

.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.topbar a { color: #0066ff; text-decoration: none; font-size: 14px; }
.topbar a:hover { text-decoration: underline; }
.topbar .right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.user-email { font-size: 14px; color: #666; }
#logout-btn { padding: 8px 16px; border: 1px solid #ccc; background: white; border-radius: 6px; cursor: pointer; font-size: 14px; color: #222; }
#logout-btn:hover { background: #eee; }

.sync { font-size: 12px; color: #666; display: flex; align-items: center; gap: 6px; background: white; padding: 5px 10px; border-radius: 999px; border: 1px solid #e3e5e8; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: #bbb; transition: background .2s; }
.sync.saving .dot { background: #f0a500; }
.sync.saved  .dot { background: #19a974; }
.sync.error  .dot { background: #d33; }

/* Layout: form left, preview right */
.layout {
    display: grid;
    grid-template-columns: minmax(380px, 1fr) minmax(520px, 1.4fr);
    gap: 24px;
    max-width: 1500px;
    margin: 0 auto;
}
@media (max-width: 1100px) {
    .layout { grid-template-columns: 1fr; }
}

/* ---------- Form panel ---------- */
.form-panel {
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    padding: 20px 24px 24px;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    position: sticky;
    top: 24px;
    align-self: start;
}
.form-panel h2 { font-size: 15px; font-weight: 600; margin: 0 0 6px; color: #444; text-transform: uppercase; letter-spacing: 0.04em; }
.form-panel section { margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid #f0f0f0; }
.form-panel section:last-child { border-bottom: none; padding-bottom: 0; }
label { display: block; font-size: 13px; color: #444; font-weight: 500; margin: 10px 0 4px; }
input[type="text"], input[type="date"], input[type="week"], textarea, select {
    display: block; width: 100%; padding: 8px 10px;
    border: 1px solid #ccc; border-radius: 6px;
    font-size: 14px; font-family: inherit; background: white;
}
textarea { resize: vertical; min-height: 60px; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

/* Dynamic list editors */
.list-editor { display: flex; flex-direction: column; gap: 6px; }
.list-row {
    display: grid; gap: 6px; align-items: center;
    background: #f7f9fc; border: 1px solid #e3e8ef;
    padding: 6px; border-radius: 6px;
}
.list-row input, .list-row textarea { padding: 6px 8px; font-size: 13px; }
.list-row button {
    background: white; border: 1px solid #ccc;
    border-radius: 4px; cursor: pointer;
    padding: 4px 8px; font-size: 12px;
}
.list-row .remove {
    color: #c00; border-color: #c00;
    padding: 4px 8px; justify-self: end;
}
.list-row .remove:hover { background: #fff0f0; }
.add-row-btn {
    align-self: flex-start;
    margin-top: 6px;
    padding: 6px 12px;
    border: 1px dashed #0066ff;
    color: #0066ff;
    background: white;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
}
.add-row-btn:hover { background: #f0f6ff; }

/* ---------- Preview panel ---------- */
.preview-panel {
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}
.preview-toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    padding-bottom: 14px;
    border-bottom: 1px solid #eee;
}
.preview-toolbar .filename {
    font-size: 12px;
    color: #555;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #f3f4f6;
    padding: 5px 10px;
    border-radius: 6px;
    flex: 1;
    min-width: 280px;
    word-break: break-all;
}
.btn-primary {
    padding: 9px 16px;
    background: #0066ff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
}
.btn-primary:hover { background: #0052cc; }
.btn-primary:disabled { background: #99b8ff; cursor: not-allowed; }
.btn-secondary {
    padding: 9px 16px;
    background: white;
    color: #222;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
}
.btn-secondary:hover { background: #eee; }

/* The actual PDF-target document */
#report-doc {
    background: white;
    border: 1px solid #e3e5e8;
    padding: 32px 36px;
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: #1a1a1a;
    font-size: 13px;
    line-height: 1.5;
    overflow-x: auto;
}
#report-doc .doc-title {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
}
#report-doc .doc-date {
    font-size: 12px;
    color: #666;
    margin-bottom: 20px;
}
#report-doc h2 {
    font-size: 14px;
    font-weight: 700;
    margin: 22px 0 8px;
    color: #1a3a5c;
    border-bottom: 1px solid #e3e5e8;
    padding-bottom: 4px;
}
#report-doc table {
    width: 100%;
    border-collapse: collapse;
    margin: 8px 0 12px;
    font-size: 12px;
}
#report-doc th, #report-doc td {
    border: 1px solid #d0d7de;
    padding: 6px 8px;
    text-align: left;
    vertical-align: top;
}
#report-doc th {
    background: #f5f7fa;
    font-weight: 600;
}
#report-doc p { margin: 6px 0; }
#report-doc ul { margin: 6px 0; padding-left: 20px; }
#report-doc li { margin: 3px 0; }
#report-doc .info-table td:first-child {
    width: 130px;
    background: #f5f7fa;
    font-weight: 500;
}

@media print {
    body * { visibility: hidden; }
    #report-doc, #report-doc * { visibility: visible; }
    #report-doc { position: absolute; left: 0; top: 0; width: 100%; }
}
</style>
</head>
<body>

<div class="topbar" id="topbar" style="display:none">
    <a href="index.html">← Home</a>
    <div class="right">
        <span class="sync" id="sync"><span class="dot"></span><span id="sync-text">Verbonden</span></span>
        <span class="user-email" id="user-email"></span>
        <button id="logout-btn">Log Out</button>
    </div>
</div>

<h1>Weekverslag Generator</h1>
<p class="hint">Vul de gegevens in — het verslag wordt live opgebouwd. Exporteer als PDF met de juiste naamconventie.</p>

<div class="layout">

    <!-- ============================================================ -->
    <!-- FORM                                                          -->
    <!-- ============================================================ -->
    <div class="form-panel">

        <section>
            <h2>Basisinfo</h2>
            <div class="row-2">
                <div>
                    <label>Datum les (bepaalt dd en YYMMDD)</label>
                    <input type="date" id="f-date">
                </div>
                <div>
                    <label>Weeknummer</label>
                    <input type="text" id="f-week" placeholder="bv. week 1">
                </div>
            </div>
            <div class="row-2">
                <div>
                    <label>Teamnummer (1-8)</label>
                    <input type="text" id="f-team" placeholder="bv. 7">
                </div>
                <div>
                    <label>Klasgroep</label>
                    <input type="text" id="f-class" placeholder="bv. 2TI-BA-Vr-7">
                </div>
            </div>
            <div class="row-2">
                <div>
                    <label>Case / bedrijf</label>
                    <input type="text" id="f-case" placeholder="bv. PermaFungi">
                </div>
                <div>
                    <label>Week label (in titel)</label>
                    <input type="text" id="f-weeklabel" placeholder="bv. Week 1">
                </div>
            </div>
        </section>

        <section>
            <h2>Teamleden & rollen</h2>
            <label>Teamleden (komma-gescheiden)</label>
            <input type="text" id="f-members" placeholder="bv. Adam Allali, Dylan De Marie, ...">

            <div class="row-2">
                <div>
                    <label>Teamleider</label>
                    <input type="text" id="f-role-leader">
                </div>
                <div>
                    <label>Secretaris</label>
                    <input type="text" id="f-role-secretary">
                </div>
            </div>
            <div class="row-2">
                <div>
                    <label>Eindredacteur</label>
                    <input type="text" id="f-role-editor">
                </div>
                <div>
                    <label>Vervanger</label>
                    <input type="text" id="f-role-replacement">
                </div>
            </div>
        </section>

        <section>
            <h2>Stand van zaken</h2>
            <label>Paragraaf</label>
            <textarea id="f-status-paragraph" rows="3"></textarea>

            <label>Bullets (één per regel)</label>
            <textarea id="f-status-bullets" rows="6" placeholder="Onderzoek PermaFungi: ...&#10;BMC: ..."></textarea>
        </section>

        <section>
            <h2>Nog open</h2>
            <label>Items (één per regel)</label>
            <textarea id="f-open" rows="4"></textarea>
        </section>

        <section>
            <h2>Taakverdeling</h2>
            <div class="list-editor" id="f-tasks-list"></div>
            <button class="add-row-btn" id="add-task">+ Persoon toevoegen</button>
        </section>

        <section>
            <h2>Vergaderingen</h2>
            <div class="list-editor" id="f-meetings-list"></div>
            <button class="add-row-btn" id="add-meeting">+ Vergadering toevoegen</button>
        </section>

        <section>
            <h2>Planning volgende week</h2>
            <div class="list-editor" id="f-planning-list"></div>
            <button class="add-row-btn" id="add-planning">+ Taak toevoegen</button>
        </section>

    </div>

    <!-- ============================================================ -->
    <!-- PREVIEW                                                       -->
    <!-- ============================================================ -->
    <div class="preview-panel">

        <div class="preview-toolbar">
            <span class="filename" id="filename-preview">BA-Weekverslag-Team-??-?-??????.pdf</span>
            <button class="btn-secondary" id="copy-filename">Kopieer naam</button>
            <button class="btn-primary" id="export-btn">Exporteer PDF</button>
        </div>

        <!-- The document that gets exported -->
        <div id="report-doc"></div>

    </div>

</div>

<script src="supabaseClient.js"></script>
<script>
(async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }

    document.getElementById('topbar').style.display = 'flex';
    document.getElementById('user-email').textContent = session.user.email;
    document.getElementById('logout-btn').addEventListener('click', async () => {
        await sb.auth.signOut();
        window.location.href = 'login.html';
    });

    const syncEl = document.getElementById('sync');
    const syncText = document.getElementById('sync-text');
    function setSync(s, t) { syncEl.className = 'sync ' + s; syncText.textContent = t; }

    /* ============================================================
       STATE
       ============================================================ */
    // The form data lives here. Everything else derives from it.
    const data = {
        date: '',
        week: 'week 1',
        team: '7',
        class: '2TI-BA-Vr-7',
        case: 'PermaFungi',
        weeklabel: 'Week 1',
        members: '',
        roles: { leader: '', secretary: '', editor: '', replacement: '' },
        status: { paragraph: '', bullets: '' },   // bullets stored as newline-separated string
        open: '',
        tasks: [],        // [{ name, tasks }]
        meetings: [],     // [{ date, topic, conclusion }]
        planning: []      // [{ task, who }]
    };

    /* ============================================================
       FILENAME COMPUTATION (per docent's convention)
       ============================================================ */
    function computeFileName() {
        if (!data.date) return 'BA-Weekverslag-Team-??-?-??????.pdf';
        const d = new Date(data.date + 'T12:00:00'); // avoid timezone surprises
        const dayMap = { 1: 'ma', 2: 'di', 3: 'wo', 4: 'do', 5: 'vr', 6: 'za', 0: 'zo' };
        const dd = dayMap[d.getDay()] || '??';
        const X = data.team || '?';
        const yy = String(d.getFullYear()).slice(-2);
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `BA-Weekverslag-Team-${dd}-${X}-${yy}${mm}${day}.pdf`;
    }

    function formatDateNL(isoDate) {
        if (!isoDate) return '';
        const d = new Date(isoDate + 'T12:00:00');
        const monthNames = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
        return `${monthNames[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
    }

    /* ============================================================
       DOM REFS
       ============================================================ */
    const $ = id => document.getElementById(id);
    const previewEl = $('report-doc');
    const filenameEl = $('filename-preview');

    /* ============================================================
       FORM ↔ DATA binding
       ============================================================ */
    const fieldMap = {
        'f-date':            v => data.date = v,
        'f-week':            v => data.week = v,
        'f-team':            v => data.team = v,
        'f-class':           v => data.class = v,
        'f-case':            v => data.case = v,
        'f-weeklabel':       v => data.weeklabel = v,
        'f-members':         v => data.members = v,
        'f-role-leader':     v => data.roles.leader = v,
        'f-role-secretary':  v => data.roles.secretary = v,
        'f-role-editor':     v => data.roles.editor = v,
        'f-role-replacement':v => data.roles.replacement = v,
        'f-status-paragraph':v => data.status.paragraph = v,
        'f-status-bullets':  v => data.status.bullets = v,
        'f-open':            v => data.open = v
    };
    Object.entries(fieldMap).forEach(([id, setter]) => {
        const el = $(id);
        if (!el) return;
        el.addEventListener('input', () => { setter(el.value); refresh(); });
    });

    /* ============================================================
       DYNAMIC LISTS (tasks, meetings, planning)
       ============================================================ */
    function renderTasks() {
        const c = $('f-tasks-list');
        c.innerHTML = '';
        data.tasks.forEach((row, i) => {
            const div = document.createElement('div');
            div.className = 'list-row';
            div.style.gridTemplateColumns = '1fr 2fr auto';
            div.innerHTML = `
                <input type="text" placeholder="Naam" value="${escapeAttr(row.name)}" data-field="name">
                <input type="text" placeholder="Taken" value="${escapeAttr(row.tasks)}" data-field="tasks">
                <button class="remove" data-i="${i}">×</button>
            `;
            div.querySelectorAll('input').forEach(inp => {
                inp.addEventListener('input', () => {
                    data.tasks[i][inp.dataset.field] = inp.value;
                    refresh();
                });
            });
            div.querySelector('.remove').addEventListener('click', () => {
                data.tasks.splice(i, 1);
                renderTasks(); refresh();
            });
            c.appendChild(div);
        });
    }

    function renderMeetings() {
        const c = $('f-meetings-list');
        c.innerHTML = '';
        data.meetings.forEach((row, i) => {
            const div = document.createElement('div');
            div.className = 'list-row';
            div.style.gridTemplateColumns = '90px 1fr 2fr auto';
            div.innerHTML = `
                <input type="text" placeholder="Datum" value="${escapeAttr(row.date)}" data-field="date">
                <input type="text" placeholder="Onderwerp" value="${escapeAttr(row.topic)}" data-field="topic">
                <input type="text" placeholder="Conclusie" value="${escapeAttr(row.conclusion)}" data-field="conclusion">
                <button class="remove" data-i="${i}">×</button>
            `;
            div.querySelectorAll('input').forEach(inp => {
                inp.addEventListener('input', () => {
                    data.meetings[i][inp.dataset.field] = inp.value;
                    refresh();
                });
            });
            div.querySelector('.remove').addEventListener('click', () => {
                data.meetings.splice(i, 1);
                renderMeetings(); refresh();
            });
            c.appendChild(div);
        });
    }

    function renderPlanning() {
        const c = $('f-planning-list');
        c.innerHTML = '';
        data.planning.forEach((row, i) => {
            const div = document.createElement('div');
            div.className = 'list-row';
            div.style.gridTemplateColumns = '2fr 1fr auto';
            div.innerHTML = `
                <input type="text" placeholder="Taak" value="${escapeAttr(row.task)}" data-field="task">
                <input type="text" placeholder="Wie" value="${escapeAttr(row.who)}" data-field="who">
                <button class="remove" data-i="${i}">×</button>
            `;
            div.querySelectorAll('input').forEach(inp => {
                inp.addEventListener('input', () => {
                    data.planning[i][inp.dataset.field] = inp.value;
                    refresh();
                });
            });
            div.querySelector('.remove').addEventListener('click', () => {
                data.planning.splice(i, 1);
                renderPlanning(); refresh();
            });
            c.appendChild(div);
        });
    }

    $('add-task').addEventListener('click', () => {
        data.tasks.push({ name: '', tasks: '' }); renderTasks(); refresh();
    });
    $('add-meeting').addEventListener('click', () => {
        data.meetings.push({ date: '', topic: '', conclusion: '' }); renderMeetings(); refresh();
    });
    $('add-planning').addEventListener('click', () => {
        data.planning.push({ task: '', who: '' }); renderPlanning(); refresh();
    });

    /* ============================================================
       PREVIEW RENDER
       ============================================================ */
    function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s ?? '';
        return d.innerHTML;
    }
    function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }

    function renderPreview() {
        const bulletsHtml = data.status.bullets
            .split('\n').map(l => l.trim()).filter(Boolean)
            .map(l => `<li>${escapeHtml(l)}</li>`).join('');

        const openHtml = data.open
            .split('\n').map(l => l.trim()).filter(Boolean)
            .map(l => `<li>${escapeHtml(l)}</li>`).join('');

        const tasksRows = data.tasks.map(t => `
            <tr>
                <td>${escapeHtml(t.name)}</td>
                <td>${escapeHtml(t.tasks)}</td>
            </tr>`).join('');

        const meetingsRows = data.meetings.map(m => `
            <tr>
                <td>${escapeHtml(m.date)}</td>
                <td>${escapeHtml(m.topic)}</td>
                <td>${escapeHtml(m.conclusion)}</td>
            </tr>`).join('');

        const planningRows = data.planning.map(p => `
            <tr>
                <td>${escapeHtml(p.task)}</td>
                <td>${escapeHtml(p.who)}</td>
            </tr>`).join('');

        previewEl.innerHTML = `
            <div class="doc-title">Weekverslag BA ${escapeHtml(data.case)} – ${escapeHtml(data.week)}</div>
            <div class="doc-date">${escapeHtml(formatDateNL(data.date))}</div>

            <h2>Info</h2>
            <table class="info-table">
                <tr><td>Team</td><td>${escapeHtml(data.class)}</td></tr>
                <tr><td>Case</td><td>${escapeHtml(data.case)}</td></tr>
                <tr><td>Week</td><td>${escapeHtml(data.week)}</td></tr>
                <tr><td>Teamleden</td><td>${escapeHtml(data.members)}</td></tr>
                <tr><td>Rollen</td><td>
                    Teamleider: ${escapeHtml(data.roles.leader)} ·
                    Secretaris: ${escapeHtml(data.roles.secretary)} ·
                    Eindredacteur: ${escapeHtml(data.roles.editor)} ·
                    Vervanger: ${escapeHtml(data.roles.replacement)}
                </td></tr>
                <tr><td>Bestandsnaam</td><td>${escapeHtml(computeFileName())}</td></tr>
            </table>

            <h2>Stand van zaken</h2>
            ${data.status.paragraph ? `<p>${escapeHtml(data.status.paragraph)}</p>` : ''}
            ${bulletsHtml ? `<ul>${bulletsHtml}</ul>` : ''}

            ${openHtml ? `<h2>Nog open</h2><ul>${openHtml}</ul>` : ''}

            ${tasksRows ? `<h2>Taakverdeling</h2>
                <table>
                    <thead><tr><th>Naam</th><th>Taken week ${escapeHtml(data.week.replace(/[^0-9]/g, '') || '')}</th></tr></thead>
                    <tbody>${tasksRows}</tbody>
                </table>` : ''}

            ${meetingsRows ? `<h2>Vergaderingen</h2>
                <table>
                    <thead><tr><th>Datum</th><th>Onderwerp</th><th>Conclusie</th></tr></thead>
                    <tbody>${meetingsRows}</tbody>
                </table>` : ''}

            ${planningRows ? `<h2>Planning volgende week</h2>
                <table>
                    <thead><tr><th>Taak</th><th>Wie</th></tr></thead>
                    <tbody>${planningRows}</tbody>
                </table>` : ''}
        `;

        filenameEl.textContent = computeFileName();
    }

    function refresh() {
        renderPreview();
        scheduleSave();
    }

    /* ============================================================
       SUPABASE PERSISTENCE (per week)
       ============================================================ */
    function currentWeekKey() {
        if (!data.date) return null;
        const d = new Date(data.date + 'T12:00:00');
        // ISO week number
        const target = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        const dayNum = target.getUTCDay() || 7;
        target.setUTCDate(target.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(target.getUTCFullYear(), 0, 1));
        const week = Math.ceil((((target - yearStart) / 86400000) + 1) / 7);
        return `${target.getUTCFullYear()}-W${String(week).padStart(2, '0')}`;
    }

    let saveTimer;
    function scheduleSave() {
        setSync('saving', 'Opslaan…');
        clearTimeout(saveTimer);
        saveTimer = setTimeout(doSave, 800);
    }

    async function doSave() {
        const key = currentWeekKey();
        if (!key) { setSync('idle', ''); return; }
        const { error } = await sb.from('weekverslagen').upsert({
            id: key,
            data: data,
            updated_at: new Date().toISOString(),
            updated_by: session.user.id
        }, { onConflict: 'id' });
        if (error) setSync('error', 'Fout: ' + error.message);
        else setSync('saved', 'Opgeslagen');
    }

    async function loadForDate() {
        const key = currentWeekKey();
        if (!key) return;
        const { data: rows, error } = await sb
            .from('weekverslagen').select('*').eq('id', key).limit(1);
        if (error || !rows || rows.length === 0) return;
        Object.assign(data, rows[0].data);
        // Repopulate form fields from data
        $('f-date').value = data.date || '';
        $('f-week').value = data.week || '';
        $('f-team').value = data.team || '';
        $('f-class').value = data.class || '';
        $('f-case').value = data.case || '';
        $('f-weeklabel').value = data.weeklabel || '';
        $('f-members').value = data.members || '';
        $('f-role-leader').value = data.roles.leader || '';
        $('f-role-secretary').value = data.roles.secretary || '';
        $('f-role-editor').value = data.roles.editor || '';
        $('f-role-replacement').value = data.roles.replacement || '';
        $('f-status-paragraph').value = data.status.paragraph || '';
        $('f-status-bullets').value = data.status.bullets || '';
        $('f-open').value = data.open || '';
        renderTasks(); renderMeetings(); renderPlanning();
        refresh();
    }

    // Reload when the user changes the date
    $('f-date').addEventListener('change', loadForDate);

    /* ============================================================
       PDF EXPORT
       ============================================================ */
    $('export-btn').addEventListener('click', async () => {
        const btn = $('export-btn');
        btn.disabled = true;
        btn.textContent = 'Bezig…';

        try {
            const filename = computeFileName();
            const element = $('report-doc');

            await html2pdf().set({
                margin: [10, 10, 14, 10],
                filename: filename,
                image: { type: 'jpeg', quality: 0.95 },
                html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
            }).from(element).save();
        } catch (err) {
            console.error('PDF error:', err);
            alert('Fout bij PDF export: ' + err.message);
        } finally {
            btn.disabled = false;
            btn.textContent = 'Exporteer PDF';
        }
    });

    /* ============================================================
       COPY FILENAME
       ============================================================ */
    $('copy-filename').addEventListener('click', async () => {
        const filename = computeFileName();
        try {
            await navigator.clipboard.writeText(filename);
            const btn = $('copy-filename');
            const old = btn.textContent;
            btn.textContent = 'Gekopieerd!';
            setTimeout(() => btn.textContent = old, 1500);
        } catch (err) {
            alert('Kon niet kopiëren: ' + err.message);
        }
    });

    /* ============================================================
       INITIAL PREVIEW
       ============================================================ */
    // Default the date to today's date for convenience
    const today = new Date();
    const iso = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    $('f-date').value = iso;
    data.date = iso;

    renderTasks();
    renderMeetings();
    renderPlanning();
    refresh();
    setSync('idle', '');
})();
</script>
</body>
</html>
