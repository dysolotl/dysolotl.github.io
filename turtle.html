<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turtle Diagrams - PermaFungi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: #f5f6f8;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    padding: 24px;
}
h1 { font-size: clamp(24px, 3vw, 32px); font-weight: 600; margin: 0 0 6px; text-align: center; }
.hint { color: #666; font-size: 14px; margin: 0 auto 24px; line-height: 1.5; text-align: center; max-width: 780px; }

/* Topbar */
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.topbar a { color: #0066ff; text-decoration: none; font-size: 14px; }
.topbar a:hover { text-decoration: underline; }
.topbar .right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.user-email { font-size: 14px; color: #666; }
#logout-btn { padding: 8px 16px; border: 1px solid #ccc; background: white; border-radius: 6px; cursor: pointer; font-size: 14px; color: #222; }
#logout-btn:hover { background: #eee; }

.sync { font-size: 12px; color: #666; display: flex; align-items: center; gap: 6px; background: white; padding: 5px 10px; border-radius: 999px; border: 1px solid #e3e5e8; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: #bbb; transition: background .2s; }
.sync.saving .dot { background: #f0a500; }
.sync.saved  .dot { background: #19a974; }
.sync.error  .dot { background: #d33; }

/* Nav */
.nav-bar { display: flex; justify-content: center; align-items: center; gap: 16px; margin-bottom: 20px; }
.nav-btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid #ccc; background: white;
    font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: #222;
}
.nav-btn:hover:not(:disabled) { background: #0066ff; color: white; border-color: #0066ff; }
.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.page-indicator {
    font-size: 14px; color: #444; min-width: 120px; text-align: center;
    background: white; padding: 10px 20px; border-radius: 999px;
    border: 1px solid #e3e5e8; font-weight: 500;
}

/* Card */
.diagram-card {
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    padding: 32px 40px 40px 40px;
    max-width: 1300px;
    margin: 0 auto;
    position: relative;
}
.diagram-card.page-1 { border: 3px solid #4a90c2; }
.diagram-card.page-2 { border: 3px solid #7a3f9e; }

.page-badge {
    position: absolute;
    top: 0; right: 0;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 14px;
    border-bottom-left-radius: 8px;
}
.diagram-card.page-1 .page-badge { background: #4a90c2; }
.diagram-card.page-2 .page-badge { background: #7a3f9e; }

.diagram-title {
    font-size: 22px; font-weight: 500; margin: 0 0 8px;
    outline: none; display: inline-block; padding: 2px 6px;
    border-bottom: 1px dashed transparent;
}
.diagram-title:hover { border-bottom-color: #ccc; }
.diagram-title:focus { border-bottom-color: #0066ff; }

/* ============================================================
   TURTLE STAGE — percentage-positioned layout matching the reference
   ============================================================ */
.turtle-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1200 / 700;
    margin-top: 16px;
}

/* SVG arrow layer */
.turtle-stage svg.arrows {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    overflow: visible;
}
.turtle-stage svg.arrows line {
    stroke: #7a8694;
    stroke-width: 1.2;
}

/* ---------- Blocks ---------- */
.block {
    position: absolute;
    background: #4aa3d9;
    border: 1.5px solid #2c6d9c;
    color: #ffffff;
    padding: 12px 16px;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    z-index: 2;
    transition: filter .12s;
    text-align: center;
}
.block:hover { filter: brightness(1.05); }

.block[data-tone="blue"]   { background: #4aa3d9; border-color: #2c6d9c; color: #fff; }
.block[data-tone="teal"]   { background: #33c6c6; border-color: #0b5c5c; color: #fff; }
.block[data-tone="yellow"] { background: #eaf24a; border-color: #8a9100; color: #111; }
.block[data-tone="green"]  { background: #7fc97f; border-color: #2e6b2e; color: #111; }

/* ---------- Positions (percent of stage) ---------- */
/* Row 1: Regels (left-center), Doel (right-center) */
.block.pos-regels  { left: 18%; top: 5%;  width: 20%; min-height: 18%; }
.block.pos-doel    { left: 58%; top: 5%;  width: 20%; min-height: 18%; }

/* Row 2: Start (far left), Einde (far right) */
.block.pos-start   { left: 4%;  top: 34%; width: 20%; min-height: 15%; }
.block.pos-einde   { left: 76%; top: 34%; width: 20%; min-height: 15%; }

/* Row 3: Input (far left), Output (far right) */
.block.pos-input   { left: 4%;  top: 58%; width: 20%; min-height: 15%; }
.block.pos-output  { left: 76%; top: 58%; width: 20%; min-height: 15%; }

/* Row 4 (bottom): Stakeholders, Verantwoordelijke, Resources, Klanten */
.block.pos-stake   { left: 4%;  top: 84%; width: 20%; min-height: 14%; }
.block.pos-verant  { left: 31%; top: 84%; width: 20%; min-height: 14%; }
.block.pos-res     { left: 58%; top: 84%; width: 20%; min-height: 14%; }
.block.pos-klanten { left: 76%; top: 84%; width: 20%; min-height: 14%; }

.block-label {
    font-weight: 700;
    font-size: 14px;
    outline: none;
    text-align: center;
    letter-spacing: 0.01em;
}
.block-text {
    font-size: 12px;
    line-height: 1.35;
    outline: none;
    white-space: pre-wrap;
    text-align: center;
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
}
.block-text:empty::before,
.block-label:empty::before { content: "typ hier"; opacity: .55; }

/* Block actions */
.block .actions {
    position: absolute;
    top: -10px; right: -10px;
    display: none; gap: 4px;
    z-index: 3;
}
.block:hover .actions,
.block:focus-within .actions { display: flex; }
.block .actions button {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid #111;
    background: white;
    cursor: pointer;
    padding: 0;
    font-size: 12px;
    line-height: 1;
}
.block .actions .tone-btn[data-tone="blue"]   { background: #4aa3d9; }
.block .actions .tone-btn[data-tone="teal"]   { background: #33c6c6; }
.block .actions .tone-btn[data-tone="yellow"] { background: #eaf24a; }
.block .actions .tone-btn[data-tone="green"]  { background: #7fc97f; }
.block .actions .del { color: #a00; font-weight: 700; }

/* ---------- Center process chevron ---------- */
.process-shape {
    position: absolute;
    left: 26%;
    top: 41%;
    width: 48%;
    height: 20%;
    background: #4aa3d9;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 60px;
    z-index: 2;
    clip-path: polygon(
        5% 0%,
        95% 0%,
        100% 50%,
        95% 100%,
        5% 100%,
        0% 50%
    );
    box-shadow: 2px 2px 0 rgba(0,0,0,0.12);
}
.process-shape[data-tone="blue"]   { background: #4aa3d9; }
.process-shape[data-tone="teal"]   { background: #33c6c6; }
.process-shape[data-tone="yellow"] { background: #eaf24a; color: #111; }
.process-shape[data-tone="green"]  { background: #7fc97f; color: #111; }

.process-text {
    outline: none;
    font-weight: 600;
    font-size: 17px;
    text-align: center;
    line-height: 1.3;
}
.process-text:empty::before { content: "typ hier"; opacity: .6; }

/* Process actions */
.process-shape .actions {
    position: absolute;
    top: 0; right: 0;
    display: none; gap: 4px;
    z-index: 3;
    transform: translate(0, -110%);
}
.process-shape:hover .actions { display: flex; }
.process-shape .actions button {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid #111;
    background: white;
    cursor: pointer;
    padding: 0;
    font-size: 12px;
    line-height: 1;
}
.process-shape .actions .tone-btn[data-tone="blue"]   { background: #4aa3d9; }
.process-shape .actions .tone-btn[data-tone="teal"]   { background: #33c6c6; }
.process-shape .actions .tone-btn[data-tone="yellow"] { background: #eaf24a; }
.process-shape .actions .tone-btn[data-tone="green"]  { background: #7fc97f; }

/* Extras section */
.extras {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px dashed #ddd;
}
.extras-label {
    font-size: 12px; color: #888; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 0.05em;
}
.extras-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
}
.extras .block {
    position: relative;
    left: auto; top: auto; width: auto; min-height: 80px;
}

.add-block-btn {
    margin-top: 20px;
    padding: 8px 14px;
    background: white;
    color: #0066ff;
    border: 1px dashed #0066ff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
}
.add-block-btn:hover { background: #f0f6ff; }

.bar { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 1300px; margin-left: auto; margin-right: auto; }
.bar button {
    font: inherit; font-size: 14px; padding: 9px 16px;
    border-radius: 6px; cursor: pointer; border: 1px solid #ccc;
    background: white; color: #a00;
}
.bar button:hover { background: #fff0f0; border-color: #a00; }

/* Responsive */
@media (max-width: 900px) {
    .turtle-stage {
        aspect-ratio: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        position: static;
    }
    .turtle-stage svg.arrows { display: none; }
    .block {
        position: static !important;
        width: 100% !important;
        left: auto !important; top: auto !important;
        min-height: 80px !important;
    }
    .process-shape {
        position: static;
        clip-path: none;
        border-radius: 8px;
        width: 100%;
        height: auto;
        min-height: 70px;
        padding: 20px;
    }
}
</style>
</head>
<body>

<div class="topbar" id="topbar" style="display:none">
    <a href="index.html">← Home</a>
    <div class="right">
        <span class="sync" id="sync"><span class="dot"></span><span id="sync-text">Verbonden</span></span>
        <span class="user-email" id="user-email"></span>
        <button id="logout-btn">Log Out</button>
    </div>
</div>

<h1>Turtle Diagrams</h1>
<p class="hint">Klik op een blok om de tekst aan te passen. Beweeg over een blok om de kleur te wijzigen of te verwijderen. Gebruik de pijltjes om tussen diagrammen te wisselen.</p>

<div class="nav-bar" id="nav-bar" style="display:none">
    <button class="nav-btn" id="prev-btn" aria-label="Vorige">‹</button>
    <span class="page-indicator" id="page-indicator">Pagina 1 / 2</span>
    <button class="nav-btn" id="next-btn" aria-label="Volgende">›</button>
</div>

<div id="diagram-container"></div>

<div class="bar" id="bottom-bar" style="display:none">
    <button id="reset">Reset voor hele team</button>
</div>

<script src="supabaseClient.js"></script>
<script>
(async () => {
    /* ---------- 1. Auth ---------- */
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }

    document.getElementById('topbar').style.display = 'flex';
    document.getElementById('nav-bar').style.display = 'flex';
    document.getElementById('bottom-bar').style.display = 'flex';
    document.getElementById('user-email').textContent = session.user.email;
    document.getElementById('logout-btn').addEventListener('click', async () => {
        await sb.auth.signOut();
        window.location.href = 'login.html';
    });

    /* ---------- 2. Defaults ---------- */
    const PAGES = ['page1', 'page2'];

    const DEFAULTS = {
        page1: {
            title: "Page 1 - Produceren",
            center: "Een batch mallen inoculeren",
            badge: "A",
            blocks: [
                { id: "regels",  label: "Regels",            text: "Werken in een steriele productieomgeving, veiligheidsregels respecteren. Productie volgens de standaard werkinstructies", tone: "blue" },
                { id: "doel",    label: "DOEL",              text: "Mallen vullen met substraat en mycelium, zodat het mycelium kan uitgroeien tot de gewenste verpakkingsvorm", tone: "blue" },
                { id: "start",   label: "Start",             text: "Steriel substraat is afgekoeld en mallen zijn klaar", tone: "blue" },
                { id: "einde",   label: "EINDE",             text: "Productiebatch is gegenereerd en klaar voor kwaliteitscontrole", tone: "blue" },
                { id: "input",   label: "Input",             text: "Koffiedik en afval / grondstoffen, productieplanning", tone: "blue" },
                { id: "output",  label: "OUTPUT",            text: "Geproduceerde mycelium verpakking / productiebatch", tone: "blue" },
                { id: "stake",   label: "Stakeholders",      text: "Productiemedewerkers in Vorst, Microbiologen & kwaliteitslaboranten, Proces- en productie-ingenieurs", tone: "blue" },
                { id: "verant",  label: "VERANTWOORDELIJKE", text: "Productiemedewerkers in Vorst", tone: "blue" },
                { id: "res",     label: "RESOURCES",         text: "Fabriek in Vorst, productieomgeving, microbiologische kennis, productiemedewerkers", tone: "blue" },
                { id: "klanten", label: "KLANTEN",           text: "Kwaliteitscontrole / volgende stap in het productieproces", tone: "blue" }
            ]
        },
        page2: {
            title: "Page 2 - Kwaliteitscontrole",
            center: "Een kwaliteitscontrole uitvoeren",
            badge: "B",
            blocks: [
                { id: "regels",  label: "Regels",            text: "Controle volgens het kwaliteitshandboek en de vastgelegde criteria, veiligheidsregels respecteren. Afwijkingen verplicht registreren", tone: "teal" },
                { id: "doel",    label: "DOEL",              text: "Kwaliteit van de productiebatch controleren en afwijkingen detecteren", tone: "teal" },
                { id: "start",   label: "Start",             text: "Productiebatch is gegenereerd", tone: "teal" },
                { id: "einde",   label: "EINDE",             text: "Batch is goedgekeurd en resultaat is vastgelegd", tone: "teal" },
                { id: "input",   label: "Input",             text: "Geproduceerde productiebatch + productiegegevens, kwaliteitscriteria", tone: "teal" },
                { id: "output",  label: "OUTPUT",            text: "Kwaliteitsresultaat / geregistreerde afwijking", tone: "teal" },
                { id: "stake",   label: "Stakeholders",      text: "Productiemedewerkers in Vorst, Microbiologen & kwaliteitslaboranten", tone: "teal" },
                { id: "verant",  label: "VERANTWOORDELIJKE", text: "Microbiologen & kwaliteitslaboranten", tone: "teal" },
                { id: "res",     label: "RESOURCES",         text: "Kwaliteitscontrole, proces-ingenieurs, productiedashboard, batchregistratie, Controle-harnais, Weegschaal en meetinstrumenten", tone: "teal" },
                { id: "klanten", label: "KLANTEN",           text: "Productiemedewerkers / verdere productie- of leveringsstap", tone: "teal" }
            ]
        }
    };

    /* ---------- 3. State ---------- */
    let state = JSON.parse(JSON.stringify(DEFAULTS));
    let currentPage = 0;
    let focused = null;

    const syncEl = document.getElementById('sync');
    const syncText = document.getElementById('sync-text');
    function setSync(s, t) { syncEl.className = 'sync ' + s; syncText.textContent = t; }

    /* ---------- 4. Load ---------- */
    async function loadAll() {
        const { data, error } = await sb.from('turtle_state').select('*');
        if (error) { setSync('error', 'Laadfout: ' + error.message); return; }

        if (!data || data.length === 0) {
            const rows = PAGES.map(id => ({
                id,
                title: DEFAULTS[id].title,
                center: DEFAULTS[id].center,
                blocks: DEFAULTS[id].blocks,
                updated_by: session.user.id
            }));
            const { error: seedErr } = await sb.from('turtle_state').insert(rows);
            if (seedErr) setSync('error', 'Seed-fout: ' + seedErr.message);
            else setSync('saved', 'Opgeslagen');
        } else {
            data.forEach(row => {
                state[row.id] = {
                    title: row.title,
                    center: row.center,
                    badge: DEFAULTS[row.id]?.badge || '?',
                    blocks: row.blocks
                };
            });
            setSync('saved', 'Opgeslagen');
        }
    }

    /* ---------- 5. Save ---------- */
    const saveTimers = {};
    function queueSave(pageId) {
        setSync('saving', 'Opslaan…');
        clearTimeout(saveTimers[pageId]);
        saveTimers[pageId] = setTimeout(async () => {
            const { error } = await sb.from('turtle_state').upsert({
                id: pageId,
                title: state[pageId].title,
                center: state[pageId].center,
                blocks: state[pageId].blocks,
                updated_at: new Date().toISOString(),
                updated_by: session.user.id
            }, { onConflict: 'id' });
            if (error) setSync('error', 'Fout: ' + error.message);
            else setSync('saved', 'Opgeslagen');
        }, 600);
    }

    /* ---------- 6. Positions ---------- */
    const POSITIONS = {
        regels:  'pos-regels',
        doel:    'pos-doel',
        start:   'pos-start',
        einde:   'pos-einde',
        input:   'pos-input',
        output:  'pos-output',
        stake:   'pos-stake',
        verant:  'pos-verant',
        res:     'pos-res',
        klanten: 'pos-klanten'
    };
    const KNOWN = Object.keys(POSITIONS);

    /* ---------- 7. Render ---------- */
    function renderDiagram() {
        const container = document.getElementById('diagram-container');
        container.innerHTML = '';

        const pageId = PAGES[currentPage];
        const page = state[pageId];
        const pageNum = currentPage + 1;

        const card = document.createElement('div');
        card.className = 'diagram-card page-' + pageNum;

        const badge = document.createElement('div');
        badge.className = 'page-badge';
        badge.textContent = page.badge || '?';
        card.appendChild(badge);

        const title = document.createElement('div');
        title.className = 'diagram-title';
        title.contentEditable = 'true';
        title.textContent = page.title;
        title.addEventListener('focus', () => { focused = { page: pageId, field: 'title' }; });
        title.addEventListener('blur',  () => { focused = null; });
        title.addEventListener('input', () => { page.title = title.textContent; queueSave(pageId); });
        card.appendChild(title);

        const stage = document.createElement('div');
        stage.className = 'turtle-stage';

        // SVG arrow layer
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'arrows');
        const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
        defs.innerHTML = `
            <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <polygon points="0,0 10,5 0,10" fill="#7a8694" />
            </marker>`;
        svg.appendChild(defs);
        stage.appendChild(svg);

        // Center process shape
        const processEl = buildProcessShape(pageId, page);
        stage.appendChild(processEl);

        // Default blocks
        KNOWN.forEach(id => {
            const b = page.blocks.find(x => x.id === id);
            if (!b) return;
            const el = buildBlock(pageId, b);
            el.classList.add(POSITIONS[id]);
            stage.appendChild(el);
        });

        card.appendChild(stage);

        // Extras
        const customs = page.blocks.filter(b => !KNOWN.includes(b.id));
        if (customs.length > 0) {
            const extras = document.createElement('div');
            extras.className = 'extras';
            extras.innerHTML = '<div class="extras-label">Extra blokken</div>';
            const eg = document.createElement('div');
            eg.className = 'extras-grid';
            customs.forEach(b => eg.appendChild(buildBlock(pageId, b)));
            extras.appendChild(eg);
            card.appendChild(extras);
        }

        // Add block button
        const addBtn = document.createElement('button');
        addBtn.className = 'add-block-btn';
        addBtn.textContent = '+ Blok toevoegen';
        addBtn.addEventListener('click', () => {
            const id = 'custom_' + Date.now();
            const tone = (page.blocks[0] && page.blocks[0].tone) || 'blue';
            page.blocks.push({ id, label: 'Nieuw blok', text: '', tone });
            queueSave(pageId);
            renderDiagram();
        });
        card.appendChild(addBtn);

        container.appendChild(card);

        document.getElementById('page-indicator').textContent =
            `Pagina ${currentPage + 1} / ${PAGES.length}`;
        document.getElementById('prev-btn').disabled = currentPage === 0;
        document.getElementById('next-btn').disabled = currentPage === PAGES.length - 1;

        requestAnimationFrame(() => drawArrows(svg, stage));
    }

    function buildProcessShape(pageId, page) {
        const el = document.createElement('div');
        el.className = 'process-shape';
        el.dataset.tone = (page.blocks[0] && page.blocks[0].tone) || 'blue';

        const actions = document.createElement('div');
        actions.className = 'actions';
        ['blue', 'teal', 'yellow', 'green'].forEach(tone => {
            const tb = document.createElement('button');
            tb.className = 'tone-btn';
            tb.dataset.tone = tone;
            tb.title = 'Kleur: ' + tone;
            tb.addEventListener('click', (e) => {
                e.stopPropagation();
                page.blocks.forEach(b => b.tone = tone);
                queueSave(pageId);
                renderDiagram();
            });
            actions.appendChild(tb);
        });
        el.appendChild(actions);

        const span = document.createElement('span');
        span.className = 'process-text';
        span.contentEditable = 'true';
        span.textContent = page.center;
        span.addEventListener('focus', () => { focused = { page: pageId, field: 'center' }; });
        span.addEventListener('blur',  () => { focused = null; });
        span.addEventListener('input', () => { page.center = span.textContent; queueSave(pageId); });
        el.appendChild(span);

        return el;
    }

    function buildBlock(pageId, block) {
        const el = document.createElement('div');
        el.className = 'block';
        el.dataset.tone = block.tone || 'blue';
        el.dataset.blockId = block.id;

        const actions = document.createElement('div');
        actions.className = 'actions';
        ['blue', 'teal', 'yellow', 'green'].forEach(tone => {
            const tb = document.createElement('button');
            tb.className = 'tone-btn';
            tb.dataset.tone = tone;
            tb.title = 'Kleur: ' + tone;
            tb.addEventListener('click', (e) => {
                e.stopPropagation();
                block.tone = tone;
                queueSave(pageId);
                renderDiagram();
            });
            actions.appendChild(tb);
        });
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '×';
        del.title = 'Verwijder blok';
        del.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!confirm('Dit blok verwijderen?')) return;
            const page = state[pageId];
            page.blocks = page.blocks.filter(b => b.id !== block.id);
            queueSave(pageId);
            renderDiagram();
        });
        actions.appendChild(del);
        el.appendChild(actions);

        const labelEl = document.createElement('div');
        labelEl.className = 'block-label';
        labelEl.contentEditable = 'true';
        labelEl.textContent = block.label;
        labelEl.addEventListener('focus', () => { focused = { page: pageId, blockId: block.id, field: 'label' }; });
        labelEl.addEventListener('blur',  () => { focused = null; });
        labelEl.addEventListener('input', () => { block.label = labelEl.textContent; queueSave(pageId); });
        el.appendChild(labelEl);

        const textEl = document.createElement('div');
        textEl.className = 'block-text';
        textEl.contentEditable = 'true';
        textEl.textContent = block.text;
        textEl.addEventListener('focus', () => { focused = { page: pageId, blockId: block.id, field: 'text' }; });
        textEl.addEventListener('blur',  () => { focused = null; });
        textEl.addEventListener('input', () => { block.text = textEl.textContent; queueSave(pageId); });
        el.appendChild(textEl);

        return el;
    }

    /* ---------- 8. Arrows ---------- */
    function drawArrows(svg, stage) {
        const stageRect = stage.getBoundingClientRect();
        const processEl = stage.querySelector('.process-shape');
        if (!processEl) return;

        svg.setAttribute('viewBox', `0 0 ${stageRect.width} ${stageRect.height}`);
        svg.setAttribute('width',  stageRect.width);
        svg.setAttribute('height', stageRect.height);

        // Clear previous lines but keep defs
        svg.querySelectorAll('line').forEach(l => l.remove());

        const pRect = processEl.getBoundingClientRect();
        const pTop    = pRect.top    - stageRect.top;
        const pBottom = pRect.bottom - stageRect.top;
        const pLeft   = pRect.left   - stageRect.left;
        const pRight  = pRect.right  - stageRect.left;
        const pWidth  = pRect.width;
        const pHeight = pRect.height;
        const pCY     = pRect.top - stageRect.top + pHeight / 2;

        // Specific anchor points on the chevron edges
        const anchors = {
            regels:  { x: pLeft + pWidth * 0.35, y: pTop },
            doel:    { x: pLeft + pWidth * 0.65, y: pTop },
            start:   { x: pLeft,                  y: pCY + pHeight * 0.15 },
            input:   { x: pLeft,                  y: pCY - pHeight * 0.15 },
            stake:   { x: pLeft + pWidth * 0.20, y: pBottom },
            verant:  { x: pLeft + pWidth * 0.42, y: pBottom },
            res:     { x: pLeft + pWidth * 0.62, y: pBottom },
            output:  { x: pRight,                 y: pCY }
        };

        // Which edge of each block the line starts from
        const sources = {
            regels:  'bottom',
            doel:    'bottom',
            start:   'right',
            input:   'right',
            stake:   'top',
            verant:  'top',
            res:     'top',
            output:  'left'
        };

        Object.keys(anchors).forEach(id => {
            const blockEl = stage.querySelector(`.block[data-block-id="${id}"]`);
            if (!blockEl) return;
            const r = blockEl.getBoundingClientRect();
            let sx, sy;
            const cX = r.left - stageRect.left + r.width / 2;
            const cY = r.top  - stageRect.top + r.height / 2;
            switch (sources[id]) {
                case 'right':  sx = r.right - stageRect.left; sy = cY; break;
                case 'left':   sx = r.left  - stageRect.left; sy = cY; break;
                case 'top':    sx = cX; sy = r.top    - stageRect.top; break;
                case 'bottom':
                default:       sx = cX; sy = r.bottom - stageRect.top; break;
            }
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', sx);
            line.setAttribute('y1', sy);
            line.setAttribute('x2', anchors[id].x);
            line.setAttribute('y2', anchors[id].y);
            line.setAttribute('marker-end', 'url(#arrowhead)');
            svg.appendChild(line);
        });

        // Output → Klanten (vertical arrow on the right)
        const outputEl  = stage.querySelector(`.block[data-block-id="output"]`);
        const klantenEl = stage.querySelector(`.block[data-block-id="klanten"]`);
        if (outputEl && klantenEl) {
            const rO = outputEl.getBoundingClientRect();
            const rK = klantenEl.getBoundingClientRect();
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', rO.left - stageRect.left + rO.width * 0.5);
            line.setAttribute('y1', rO.bottom - stageRect.top);
            line.setAttribute('x2', rK.left - stageRect.left + rK.width * 0.5);
            line.setAttribute('y2', rK.top - stageRect.top);
            line.setAttribute('marker-end', 'url(#arrowhead)');
            svg.appendChild(line);
        }
    }

    /* ---------- 9. Navigation ---------- */
    document.getElementById('prev-btn').addEventListener('click', () => {
        if (currentPage > 0) { currentPage--; renderDiagram(); }
    });
    document.getElementById('next-btn').addEventListener('click', () => {
        if (currentPage < PAGES.length - 1) { currentPage++; renderDiagram(); }
    });
    document.addEventListener('keydown', (e) => {
        if (document.activeElement && document.activeElement.isContentEditable) return;
        if (e.key === 'ArrowLeft'  && currentPage > 0) { currentPage--; renderDiagram(); }
        if (e.key === 'ArrowRight' && currentPage < PAGES.length - 1) { currentPage++; renderDiagram(); }
    });
    window.addEventListener('resize', () => {
        const svg = document.querySelector('.arrows');
        const stage = document.querySelector('.turtle-stage');
        if (svg && stage) drawArrows(svg, stage);
    });

    /* ---------- 10. Realtime ---------- */
    function subscribeRealtime() {
        sb.channel('turtle-updates')
            .on('postgres_changes',
                { event: '*', schema: 'public', table: 'turtle_state' },
                (payload) => {
                    const row = payload.new || payload.old;
                    if (!row || !row.id) return;
                    if (row.updated_by && row.updated_by === session.user.id
                        && focused && focused.page === row.id) return;

                    state[row.id] = {
                        title: row.title,
                        center: row.center,
                        badge: DEFAULTS[row.id]?.badge || '?',
                        blocks: row.blocks
                    };
                    if (PAGES[currentPage] === row.id) renderDiagram();
                    setSync('saved', 'Bijgewerkt');
                })
            .subscribe();
    }

    /* ---------- 11. Reset ---------- */
    document.getElementById('reset').onclick = async () => {
        if (!confirm('Alle turtle diagrams resetten naar de beginwaarden voor het hele team?')) return;
        setSync('saving', 'Resetten…');
        const rows = PAGES.map(id => ({
            id,
            title: DEFAULTS[id].title,
            center: DEFAULTS[id].center,
            blocks: DEFAULTS[id].blocks,
            updated_at: new Date().toISOString(),
            updated_by: session.user.id
        }));
        const { error } = await sb.from('turtle_state').upsert(rows, { onConflict: 'id' });
        if (error) { setSync('error', 'Resetfout: ' + error.message); return; }
        state = JSON.parse(JSON.stringify(DEFAULTS));
        renderDiagram();
        setSync('saved', 'Gerest');
    };

    /* ---------- 12. Boot ---------- */
    setSync('saving', 'Laden…');
    await loadAll();
    renderDiagram();
    subscribeRealtime();
})();
</script>
</body>
</html>
