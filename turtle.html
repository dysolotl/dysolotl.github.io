<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turtle Diagrams - PermaFungi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: #f5f6f8;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    padding: 24px;
}
h1 { font-size: clamp(24px, 3vw, 32px); font-weight: 600; margin: 0 0 6px; text-align: center; }
.hint { color: #666; font-size: 14px; margin: 0 auto 24px; line-height: 1.5; text-align: center; max-width: 760px; }

/* Topbar */
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.topbar a { color: #0066ff; text-decoration: none; font-size: 14px; }
.topbar a:hover { text-decoration: underline; }
.topbar .right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.user-email { font-size: 14px; color: #666; }
#logout-btn { padding: 8px 16px; border: 1px solid #ccc; background: white; border-radius: 6px; cursor: pointer; font-size: 14px; color: #222; }
#logout-btn:hover { background: #eee; }

.sync { font-size: 12px; color: #666; display: flex; align-items: center; gap: 6px; background: white; padding: 5px 10px; border-radius: 999px; border: 1px solid #e3e5e8; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: #bbb; transition: background .2s; }
.sync.saving .dot { background: #f0a500; }
.sync.saved  .dot { background: #19a974; }
.sync.error  .dot { background: #d33; }

/* Nav */
.nav-bar { display: flex; justify-content: center; align-items: center; gap: 16px; margin-bottom: 20px; }
.nav-btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid #ccc; background: white;
    font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: #222;
}
.nav-btn:hover:not(:disabled) { background: #0066ff; color: white; border-color: #0066ff; }
.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.page-indicator {
    font-size: 14px; color: #444; min-width: 120px; text-align: center;
    background: white; padding: 10px 20px; border-radius: 999px;
    border: 1px solid #e3e5e8; font-weight: 500;
}

/* Card */
.diagram-card {
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    padding: 20px;
    max-width: 1100px;
    margin: 0 auto;
    position: relative;
}

/* Page border — like the screenshot (blue = page1, purple = page2) */
.diagram-card.page-1 { border: 3px solid #4a90c2; }
.diagram-card.page-2 { border: 3px solid #7a3f9e; }

/* Letter badge top-right */
.page-badge {
    position: absolute;
    top: -3px; right: -3px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 14px;
    border-bottom-left-radius: 8px;
}
.diagram-card.page-1 .page-badge { background: #4a90c2; }
.diagram-card.page-2 .page-badge { background: #7a3f9e; }

.diagram-title {
    font-size: 20px; font-weight: 600; margin: 0 0 20px;
    outline: none; display: inline-block; padding: 2px 6px;
    border-bottom: 1px dashed transparent;
}
.diagram-title:hover { border-bottom-color: #ccc; }
.diagram-title:focus { border-bottom-color: #0066ff; }

/* ============================================================
   TURTLE GRID — fixed layout matching the reference image
   ============================================================ */
.turtle-wrapper {
    position: relative;
    padding: 10px 0;
}

/* SVG connector layer sits behind the blocks */
.connectors {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: visible;
}
.connectors line {
    stroke: #b0b0b0;
    stroke-width: 1;
}

/* Three-column + bottom row grid */
.turtle-grid {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 1fr 1.15fr 1fr;
    grid-template-rows: auto auto auto auto;
    gap: 16px 20px;
    align-items: center;
}

/* Left column order: Start, Input, (empty) */
.turtle-grid > .slot-left-top    { grid-column: 1; grid-row: 1; }
.turtle-grid > .slot-left-mid    { grid-column: 1; grid-row: 2; }
.turtle-grid > .slot-left-bottom { grid-column: 1; grid-row: 3; }

/* Center column */
.turtle-grid > .slot-center-top    { grid-column: 2; grid-row: 1; }
.turtle-grid > .slot-center-arrow  { grid-column: 2; grid-row: 2; display: flex; align-items: center; justify-content: center; }
.turtle-grid > .slot-center-bottom { grid-column: 2; grid-row: 3; }

/* Right column order: DOEL, EINDE, OUTPUT */
.turtle-grid > .slot-right-top    { grid-column: 3; grid-row: 1; }
.turtle-grid > .slot-right-mid    { grid-column: 3; grid-row: 2; }
.turtle-grid > .slot-right-bottom { grid-column: 3; grid-row: 3; }

/* Bottom row spans all three columns */
.turtle-grid > .slot-bottom {
    grid-column: 1 / -1;
    grid-row: 4;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px 20px;
}

/* Block */
.block {
    position: relative;
    border: 1.5px solid #1f3b57;
    background: #4aa3d9;         /* default blue matching screenshot */
    color: white;
    padding: 12px 14px;
    min-height: 82px;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: filter .12s;
}
.block:hover { filter: brightness(1.03); }

.block[data-tone="teal"]   { background: #33c6c6; border-color: #0b5c5c; }
.block[data-tone="blue"]   { background: #4aa3d9; border-color: #1f3b57; }
.block[data-tone="yellow"] { background: #f5c842; border-color: #7f6000; color: #3a2d00; }
.block[data-tone="green"]  { background: #7fc97f; border-color: #2e6b2e; color: #143b14; }

.block-label {
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    outline: none;
    text-align: center;
}
.block-text {
    font-size: 11.5px;
    line-height: 1.35;
    outline: none;
    white-space: pre-wrap;
    flex: 1;
    text-align: center;
}
.block-text:empty::before,
.block-label:empty::before { content: "typ hier"; opacity: .55; }

/* Block actions (visible on hover) */
.block .actions {
    position: absolute;
    top: -9px; right: -9px;
    display: none; gap: 4px;
}
.block:hover .actions,
.block:focus-within .actions { display: flex; }
.block .actions button {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 1px solid #111;
    background: white;
    cursor: pointer;
    padding: 0;
    font-size: 12px;
    line-height: 1;
}
.block .actions .tone-btn[data-tone="blue"]   { background: #4aa3d9; }
.block .actions .tone-btn[data-tone="teal"]   { background: #33c6c6; }
.block .actions .tone-btn[data-tone="yellow"] { background: #f5c842; }
.block .actions .tone-btn[data-tone="green"]  { background: #7fc97f; }
.block .actions .del { color: #a00; }

/* Center red chevron arrow */
.center-arrow {
    position: relative;
    background: #ff5252;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-weight: 700;
    font-size: 13px;
    padding: 18px 46px;
    min-height: 70px;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
    clip-path: polygon(
        6% 0%, 94% 0%, 100% 50%,
        94% 100%, 6% 100%, 0% 50%
    );
    width: 100%;
}
.center-arrow span {
    outline: none; width: 100%; padding: 0 8px;
}
.center-arrow span:empty::before { content: "typ hier"; opacity: .7; }

/* Extras (custom-added blocks) */
.extras {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed #ddd;
}
.extras-label {
    font-size: 12px; color: #888; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 0.05em;
}
.extras-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
}

.add-block-btn {
    margin-top: 16px;
    padding: 8px 14px;
    background: white;
    color: #0066ff;
    border: 1px dashed #0066ff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
}
.add-block-btn:hover { background: #f0f6ff; }

.bar { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 1100px; margin-left: auto; margin-right: auto; }
.bar button {
    font: inherit; font-size: 14px; padding: 9px 16px;
    border-radius: 6px; cursor: pointer; border: 1px solid #ccc;
    background: white; color: #a00;
}
.bar button:hover { background: #fff0f0; border-color: #a00; }

/* Responsive */
@media (max-width: 800px) {
    .turtle-grid { grid-template-columns: 1fr; grid-template-rows: auto; }
    .turtle-grid > * { grid-column: 1 !important; grid-row: auto !important; }
    .turtle-grid > .slot-bottom { grid-template-columns: 1fr 1fr; }
    .connectors { display: none; }
    .center-arrow { clip-path: none; border-radius: 8px; }
}
</style>
</head>
<body>

<div class="topbar" id="topbar" style="display:none">
    <a href="index.html">← Home</a>
    <div class="right">
        <span class="sync" id="sync"><span class="dot"></span><span id="sync-text">Verbonden</span></span>
        <span class="user-email" id="user-email"></span>
        <button id="logout-btn">Log Out</button>
    </div>
</div>

<h1>Turtle Diagrams</h1>
<p class="hint">Klik op een blok om de tekst aan te passen. Beweeg over een blok om de kleur te wijzigen of te verwijderen. Gebruik de pijltjes om tussen diagrammen te wisselen. Wijzigingen worden direct gedeeld met je team.</p>

<div class="nav-bar" id="nav-bar" style="display:none">
    <button class="nav-btn" id="prev-btn" aria-label="Vorige">‹</button>
    <span class="page-indicator" id="page-indicator">Pagina 1 / 2</span>
    <button class="nav-btn" id="next-btn" aria-label="Volgende">›</button>
</div>

<div id="diagram-container"></div>

<div class="bar" id="bottom-bar" style="display:none">
    <button id="reset">Reset voor hele team</button>
</div>

<script src="supabaseClient.js"></script>
<script>
(async () => {
    /* ---------- 1. Auth ---------- */
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }

    document.getElementById('topbar').style.display = 'flex';
    document.getElementById('nav-bar').style.display = 'flex';
    document.getElementById('bottom-bar').style.display = 'flex';
    document.getElementById('user-email').textContent = session.user.email;
    document.getElementById('logout-btn').addEventListener('click', async () => {
        await sb.auth.signOut();
        window.location.href = 'login.html';
    });

    /* ---------- 2. Defaults ---------- */
    const PAGES = ['page1', 'page2'];

    const DEFAULTS = {
        page1: {
            title: "Page 1 - Produceren",
            center: "Een batch produceren",
            badge: "A",
            blocks: [
                { id: "regels",  label: "Regels",              text: "Werken in een steriele productieomgeving, veiligheidsregels respecteren, Productie volgens de standaard werkinstructies", tone: "blue" },
                { id: "doel",    label: "DOEL",                text: "Mycelium verpakkingen produceren volgens de vereiste hoeveelheid en kwaliteit", tone: "blue" },
                { id: "start",   label: "Start",               text: "Grondstoffen zijn beschikbaar en voorbereid, omgeving is klaar voor productieactiviteiten", tone: "blue" },
                { id: "einde",   label: "EINDE",               text: "Productiebatch is gegenereerd en klaar voor kwaliteitscontrole", tone: "blue" },
                { id: "input",   label: "Input",               text: "Koffiedik en afval / grondstoffen, productieplanning", tone: "blue" },
                { id: "output",  label: "OUTPUT",              text: "Geproduceerde mycelium verpakking / productiebatch", tone: "blue" },
                { id: "stake",   label: "Stakeholders",        text: "Productiemedewerkers in Vorst, Microbiologen & kwaliteitslaboranten, Proces- en productie-ingenieurs", tone: "blue" },
                { id: "verant",  label: "VERANTWOORDELIJKE",   text: "Productiemedewerkers in Vorst", tone: "blue" },
                { id: "res",     label: "RESOURCES",           text: "Fabriek in Vorst, productieomgeving, microbiologische kennis, productiemedewerkers", tone: "blue" },
                { id: "klanten", label: "KLANTEN",             text: "Kwaliteitscontrole / volgende stap in het productieproces", tone: "blue" }
            ]
        },
        page2: {
            title: "Page 2 - Kwaliteitscontrole",
            center: "Een kwaliteitscontrole uitvoeren",
            badge: "B",
            blocks: [
                { id: "regels",  label: "Regels",              text: "Controle volgens het kwaliteitshandboek en de vastgelegde criteria, veiligheidsregels respecteren. Afwijkingen verplicht registreren", tone: "teal" },
                { id: "doel",    label: "DOEL",                text: "Kwaliteit van de productiebatch controleren en afwijkingen detecteren", tone: "teal" },
                { id: "start",   label: "Start",               text: "Productiebatch is gegenereerd", tone: "teal" },
                { id: "einde",   label: "EINDE",               text: "Batch is goedgekeurd en resultaat is vastgelegd", tone: "teal" },
                { id: "input",   label: "Input",               text: "Geproduceerde productiebatch + productiegegevens, kwaliteitscriteria", tone: "teal" },
                { id: "output",  label: "OUTPUT",              text: "Kwaliteitsresultaat / geregistreerde afwijking", tone: "teal" },
                { id: "stake",   label: "Stakeholders",        text: "Productiemedewerkers in Vorst, Microbiologen & kwaliteitslaboranten", tone: "teal" },
                { id: "verant",  label: "VERANTWOORDELIJKE",   text: "Microbiologen & kwaliteitslaboranten", tone: "teal" },
                { id: "res",     label: "RESOURCES",           text: "Kwaliteitscontrole, proces-ingenieurs, productiedashboard, batchregistratie, Controle-harnais, Weegschaal en meetinstrumenten", tone: "teal" },
                { id: "klanten", label: "KLANTEN",             text: "Productiemedewerkers / verdere productie- of leveringsstap", tone: "teal" }
            ]
        }
    };

    /* ---------- 3. State ---------- */
    let state = JSON.parse(JSON.stringify(DEFAULTS));
    let currentPage = 0;
    let focused = null;

    const syncEl = document.getElementById('sync');
    const syncText = document.getElementById('sync-text');
    function setSync(s, t) { syncEl.className = 'sync ' + s; syncText.textContent = t; }

    /* ---------- 4. Load ---------- */
    async function loadAll() {
        const { data, error } = await sb.from('turtle_state').select('*');
        if (error) { setSync('error', 'Laadfout: ' + error.message); return; }

        if (!data || data.length === 0) {
            const rows = PAGES.map(id => ({
                id,
                title: DEFAULTS[id].title,
                center: DEFAULTS[id].center,
                blocks: DEFAULTS[id].blocks,
                updated_by: session.user.id
            }));
            const { error: seedErr } = await sb.from('turtle_state').insert(rows);
            if (seedErr) setSync('error', 'Seed-fout: ' + seedErr.message);
            else setSync('saved', 'Opgeslagen');
        } else {
            data.forEach(row => {
                state[row.id] = {
                    title: row.title,
                    center: row.center,
                    badge: DEFAULTS[row.id]?.badge || '?',
                    blocks: row.blocks
                };
            });
            setSync('saved', 'Opgeslagen');
        }
    }

    /* ---------- 5. Save ---------- */
    const saveTimers = {};
    function queueSave(pageId) {
        setSync('saving', 'Opslaan…');
        clearTimeout(saveTimers[pageId]);
        saveTimers[pageId] = setTimeout(async () => {
            const { error } = await sb.from('turtle_state').upsert({
                id: pageId,
                title: state[pageId].title,
                center: state[pageId].center,
                blocks: state[pageId].blocks,
                updated_at: new Date().toISOString(),
                updated_by: session.user.id
            }, { onConflict: 'id' });
            if (error) setSync('error', 'Fout: ' + error.message);
            else setSync('saved', 'Opgeslagen');
        }, 600);
    }

    /* ---------- 6. Layout map (fixed positions) ---------- */
    // Each slot tells which block id goes where.
    const LAYOUT = {
        leftTop:    'start',
        leftMid:    'input',
        centerTop:  'regels',
        centerBottom: 'verant',
        rightTop:   'doel',
        rightMid:   'einde',
        rightBottom:'output',
        bottom:     ['stake', 'res', 'klanten'] // note: order tweaked later
    };
    // The bottom row of the screenshot is: Stakeholders | VERANTWOORDELIJKE | RESOURCES | KLANTEN
    // But VERANTWOORDELIJKE is also below the arrow. Looking at the image again:
    //   Row 4 (bottom) has 4 blocks: Stakeholders, VERANTWOORDELIJKE, RESOURCES, KLANTEN
    //   The arrow column does NOT have a block below it in row 4.
    // So we put VERANTWOORDELIJKE in the bottom row (spanning) not under the arrow.
    // Adjust:
    const BOTTOM_ROW = ['stake', 'verant', 'res', 'klanten'];

    /* ---------- 7. Render ---------- */
    function renderDiagram() {
        const container = document.getElementById('diagram-container');
        container.innerHTML = '';

        const pageId = PAGES[currentPage];
        const page = state[pageId];
        const pageNum = currentPage + 1;

        const card = document.createElement('div');
        card.className = 'diagram-card page-' + pageNum;

        // Badge (A / B)
        const badge = document.createElement('div');
        badge.className = 'page-badge';
        badge.textContent = page.badge || '?';
        card.appendChild(badge);

        // Title
        const title = document.createElement('div');
        title.className = 'diagram-title';
        title.contentEditable = 'true';
        title.textContent = page.title;
        title.addEventListener('focus', () => { focused = { page: pageId, field: 'title' }; });
        title.addEventListener('blur',  () => { focused = null; });
        title.addEventListener('input', () => { page.title = title.textContent; queueSave(pageId); });
        card.appendChild(title);

        // Turtle wrapper (contains SVG connectors + grid)
        const wrapper = document.createElement('div');
        wrapper.className = 'turtle-wrapper';

        // SVG connector layer — we draw it after layout so we can measure positions.
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'connectors');
        wrapper.appendChild(svg);

        // Grid
        const grid = document.createElement('div');
        grid.className = 'turtle-grid';

        // Place left column blocks
        grid.appendChild(buildBlockInSlot(pageId, LAYOUT.leftTop,    'slot-left-top'));
        grid.appendChild(buildBlockInSlot(pageId, LAYOUT.leftMid,    'slot-left-mid'));

        // Center column
        grid.appendChild(buildBlockInSlot(pageId, LAYOUT.centerTop,  'slot-center-top'));

        const arrowSlot = document.createElement('div');
        arrowSlot.className = 'slot-center-arrow';
        const arrow = document.createElement('div');
        arrow.className = 'center-arrow';
        const arrowSpan = document.createElement('span');
        arrowSpan.contentEditable = 'true';
        arrowSpan.textContent = page.center;
        arrowSpan.addEventListener('focus', () => { focused = { page: pageId, field: 'center' }; });
        arrowSpan.addEventListener('blur',  () => { focused = null; });
        arrowSpan.addEventListener('input', () => { page.center = arrowSpan.textContent; queueSave(pageId); });
        arrow.appendChild(arrowSpan);
        arrowSlot.appendChild(arrow);
        grid.appendChild(arrowSlot);

        // Right column
        grid.appendChild(buildBlockInSlot(pageId, LAYOUT.rightTop,   'slot-right-top'));
        grid.appendChild(buildBlockInSlot(pageId, LAYOUT.rightMid,   'slot-right-mid'));
        grid.appendChild(buildBlockInSlot(pageId, LAYOUT.rightBottom,'slot-right-bottom'));

        // Bottom row (spanning all columns)
        const bottomSlot = document.createElement('div');
        bottomSlot.className = 'slot-bottom';
        BOTTOM_ROW.forEach(id => {
            if (id === 'verant') {
                // Skip here — placed under the arrow
                return;
            }
            const b = page.blocks.find(x => x.id === id);
            if (b) bottomSlot.appendChild(buildBlock(pageId, b));
        });
        // Add VERANTWOORDELIJKE after RESOURCES slot? No — screenshot order is:
        //   Stakeholders | VERANTWOORDELIJKE | RESOURCES | KLANTEN
        // We already built the first item; build the rest in order.
        // Simpler: rebuild bottomSlot fully with all four in order.
        bottomSlot.innerHTML = '';
        ['stake', 'verant', 'res', 'klanten'].forEach(id => {
            const b = page.blocks.find(x => x.id === id);
            if (b) bottomSlot.appendChild(buildBlock(pageId, b));
        });
        grid.appendChild(bottomSlot);

        wrapper.appendChild(grid);
        card.appendChild(wrapper);

        // Any custom blocks (not in the default set) → extras section
        const known = ['start','input','regels','verant','doel','einde','output','stake','res','klanten'];
        const custom = page.blocks.filter(b => !known.includes(b.id));
        if (custom.length > 0) {
            const extras = document.createElement('div');
            extras.className = 'extras';
            extras.innerHTML = '<div class="extras-label">Extra blokken</div>';
            const eg = document.createElement('div');
            eg.className = 'extras-grid';
            custom.forEach(b => eg.appendChild(buildBlock(pageId, b)));
            extras.appendChild(eg);
            card.appendChild(extras);
        }

        // Add-block button
        const addBtn = document.createElement('button');
        addBtn.className = 'add-block-btn';
        addBtn.textContent = '+ Blok toevoegen';
        addBtn.addEventListener('click', () => {
            const id = 'custom_' + Date.now();
            const tone = (page.blocks[0] && page.blocks[0].tone) || 'blue';
            page.blocks.push({ id, label: 'Nieuw blok', text: '', tone });
            queueSave(pageId);
            renderDiagram();
        });
        card.appendChild(addBtn);

        container.appendChild(card);

        // Update nav indicator
        document.getElementById('page-indicator').textContent =
            `Pagina ${currentPage + 1} / ${PAGES.length}`;
        document.getElementById('prev-btn').disabled = currentPage === 0;
        document.getElementById('next-btn').disabled = currentPage === PAGES.length - 1;

        // Draw connectors after layout settles
        requestAnimationFrame(() => drawConnectors(svg, wrapper));
    }

    function buildBlockInSlot(pageId, blockId, slotClass) {
        const el = document.createElement('div');
        el.className = slotClass;
        const page = state[pageId];
        const block = page.blocks.find(b => b.id === blockId);
        if (block) el.appendChild(buildBlock(pageId, block));
        return el;
    }

    function buildBlock(pageId, block) {
        const el = document.createElement('div');
        el.className = 'block';
        el.dataset.tone = block.tone || 'blue';
        el.dataset.blockId = block.id;

        // Actions
        const actions = document.createElement('div');
        actions.className = 'actions';
        ['blue', 'teal', 'yellow', 'green'].forEach(tone => {
            const tb = document.createElement('button');
            tb.className = 'tone-btn';
            tb.dataset.tone = tone;
            tb.title = 'Kleur: ' + tone;
            tb.addEventListener('click', (e) => {
                e.stopPropagation();
                block.tone = tone;
                queueSave(pageId);
                renderDiagram();
            });
            actions.appendChild(tb);
        });
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '×';
        del.title = 'Verwijder blok';
        del.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!confirm('Dit blok verwijderen?')) return;
            const page = state[pageId];
            page.blocks = page.blocks.filter(b => b.id !== block.id);
            queueSave(pageId);
            renderDiagram();
        });
        actions.appendChild(del);
        el.appendChild(actions);

        // Label
        const labelEl = document.createElement('div');
        labelEl.className = 'block-label';
        labelEl.contentEditable = 'true';
        labelEl.textContent = block.label;
        labelEl.addEventListener('focus', () => { focused = { page: pageId, blockId: block.id, field: 'label' }; });
        labelEl.addEventListener('blur',  () => { focused = null; });
        labelEl.addEventListener('input', () => { block.label = labelEl.textContent; queueSave(pageId); });
        el.appendChild(labelEl);

        // Text
        const textEl = document.createElement('div');
        textEl.className = 'block-text';
        textEl.contentEditable = 'true';
        textEl.textContent = block.text;
        textEl.addEventListener('focus', () => { focused = { page: pageId, blockId: block.id, field: 'text' }; });
        textEl.addEventListener('blur',  () => { focused = null; });
        textEl.addEventListener('input', () => { block.text = textEl.textContent; queueSave(pageId); });
        el.appendChild(textEl);

        return el;
    }

    /* ---------- 8. Connectors (lines from each block to center arrow) ---------- */
    function drawConnectors(svg, wrapper) {
        const wrapperRect = wrapper.getBoundingClientRect();
        const arrow = wrapper.querySelector('.center-arrow');
        if (!arrow) return;

        const arrowRect = arrow.getBoundingClientRect();
        const cx = arrowRect.left + arrowRect.width / 2 - wrapperRect.left;
        const cy = arrowRect.top  + arrowRect.height / 2 - wrapperRect.top;

        svg.setAttribute('viewBox', `0 0 ${wrapperRect.width} ${wrapperRect.height}`);
        svg.setAttribute('width',  wrapperRect.width);
        svg.setAttribute('height', wrapperRect.height);
        svg.innerHTML = '';

        wrapper.querySelectorAll('.block').forEach(block => {
            // Skip blocks in the extras section
            if (block.closest('.extras')) return;

            const r = block.getBoundingClientRect();
            const bx = r.left + r.width / 2 - wrapperRect.left;
            const by = r.top  + r.height / 2 - wrapperRect.top;

            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', bx);
            line.setAttribute('y1', by);
            line.setAttribute('x2', cx);
            line.setAttribute('y2', cy);
            svg.appendChild(line);
        });
    }

    /* ---------- 9. Navigation ---------- */
    document.getElementById('prev-btn').addEventListener('click', () => {
        if (currentPage > 0) { currentPage--; renderDiagram(); }
    });
    document.getElementById('next-btn').addEventListener('click', () => {
        if (currentPage < PAGES.length - 1) { currentPage++; renderDiagram(); }
    });
    document.addEventListener('keydown', (e) => {
        if (document.activeElement && document.activeElement.isContentEditable) return;
        if (e.key === 'ArrowLeft'  && currentPage > 0) { currentPage--; renderDiagram(); }
        if (e.key === 'ArrowRight' && currentPage < PAGES.length - 1) { currentPage++; renderDiagram(); }
    });

    // Redraw connectors on window resize
    window.addEventListener('resize', () => {
        const svg = document.querySelector('.connectors');
        const wrapper = document.querySelector('.turtle-wrapper');
        if (svg && wrapper) drawConnectors(svg, wrapper);
    });

    /* ---------- 10. Realtime ---------- */
    function subscribeRealtime() {
        sb.channel('turtle-updates')
            .on('postgres_changes',
                { event: '*', schema: 'public', table: 'turtle_state' },
                (payload) => {
                    const row = payload.new || payload.old;
                    if (!row || !row.id) return;
                    if (row.updated_by && row.updated_by === session.user.id
                        && focused && focused.page === row.id) {
                        return;
                    }
                    state[row.id] = {
                        title: row.title,
                        center: row.center,
                        badge: DEFAULTS[row.id]?.badge || '?',
                        blocks: row.blocks
                    };
                    if (PAGES[currentPage] === row.id) {
                        renderDiagram();
                    }
                    setSync('saved', 'Bijgewerkt');
                })
            .subscribe();
    }

    /* ---------- 11. Reset ---------- */
    document.getElementById('reset').onclick = async () => {
        if (!confirm('Alle turtle diagrams resetten naar de beginwaarden voor het hele team?')) return;
        setSync('saving', 'Resetten…');
        const rows = PAGES.map(id => ({
            id,
            title: DEFAULTS[id].title,
            center: DEFAULTS[id].center,
            blocks: DEFAULTS[id].blocks,
            updated_at: new Date().toISOString(),
            updated_by: session.user.id
        }));
        const { error } = await sb.from('turtle_state').upsert(rows, { onConflict: 'id' });
        if (error) { setSync('error', 'Resetfout: ' + error.message); return; }
        state = JSON.parse(JSON.stringify(DEFAULTS));
        renderDiagram();
        setSync('saved', 'Gerest');
    };

    /* ---------- 12. Boot ---------- */
    setSync('saving', 'Laden…');
    await loadAll();
    renderDiagram();
    subscribeRealtime();
})();
</script>
</body>
</html>
