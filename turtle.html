<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turtle Diagrams - PermaFungi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: #f5f6f8;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    padding: 24px;
}
h1 { font-size: clamp(24px, 3vw, 32px); font-weight: 600; margin: 0 0 6px; text-align: center; }
.hint { color: #666; font-size: 14px; margin: 0 auto 24px; line-height: 1.5; text-align: center; max-width: 760px; }

/* Topbar */
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.topbar a { color: #0066ff; text-decoration: none; font-size: 14px; }
.topbar a:hover { text-decoration: underline; }
.topbar .right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.user-email { font-size: 14px; color: #666; }
#logout-btn { padding: 8px 16px; border: 1px solid #ccc; background: white; border-radius: 6px; cursor: pointer; font-size: 14px; color: #222; }
#logout-btn:hover { background: #eee; }

.sync { font-size: 12px; color: #666; display: flex; align-items: center; gap: 6px; background: white; padding: 5px 10px; border-radius: 999px; border: 1px solid #e3e5e8; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: #bbb; transition: background .2s; }
.sync.saving .dot { background: #f0a500; }
.sync.saved  .dot { background: #19a974; }
.sync.error  .dot { background: #d33; }

/* Nav */
.nav-bar { display: flex; justify-content: center; align-items: center; gap: 16px; margin-bottom: 20px; }
.nav-btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid #ccc; background: white;
    font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: #222;
}
.nav-btn:hover:not(:disabled) { background: #0066ff; color: white; border-color: #0066ff; }
.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.page-indicator {
    font-size: 14px; color: #444; min-width: 120px; text-align: center;
    background: white; padding: 10px 20px; border-radius: 999px;
    border: 1px solid #e3e5e8; font-weight: 500;
}

/* Card */
.diagram-card {
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    padding: 24px;
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
}
.diagram-card.page-1 { border: 3px solid #4a90c2; }
.diagram-card.page-2 { border: 3px solid #7a3f9e; }

.page-badge {
    position: absolute;
    top: -3px; right: -3px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 14px;
    border-bottom-left-radius: 8px;
}
.diagram-card.page-1 .page-badge { background: #4a90c2; }
.diagram-card.page-2 .page-badge { background: #7a3f9e; }

.diagram-title {
    font-size: 20px; font-weight: 600; margin: 0 0 20px;
    outline: none; display: inline-block; padding: 2px 6px;
    border-bottom: 1px dashed transparent;
}
.diagram-title:hover { border-bottom-color: #ccc; }
.diagram-title:focus { border-bottom-color: #0066ff; }

/* ============================================================
   TURTLE DIAGRAM — absolute-positioned layout matching the reference
   ============================================================ */
.turtle-stage {
    position: relative;
    width: 100%;
    /* aspect ratio tuned so blocks keep similar proportions across widths */
    aspect-ratio: 1200 / 640;
    min-height: 520px;
    margin-top: 8px;
}

/* SVG arrow layer behind the blocks */
.turtle-stage svg.arrows {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}
.turtle-stage svg.arrows line,
.turtle-stage svg.arrows polyline {
    stroke: #333;
    stroke-width: 1.2;
    fill: none;
}
.turtle-stage svg.arrows polygon.arrowhead {
    fill: #333;
    stroke: none;
}

/* Blocks — positioned with percentages so they scale with the stage */
.block {
    position: absolute;
    border: 1.5px solid #1f3b57;
    background: #eaf24a;    /* default yellow-green like the reference */
    color: #111;
    padding: 10px 12px;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 2;
    min-height: 60px;
    transition: filter .12s;
}
.block:hover { filter: brightness(1.04); }

.block[data-tone="yellow"] { background: #eaf24a; border-color: #6a7200; }
.block[data-tone="blue"]   { background: #4aa3d9; border-color: #1f3b57; color: #fff; }
.block[data-tone="teal"]   { background: #33c6c6; border-color: #0b5c5c; }
.block[data-tone="green"]  { background: #7fc97f; border-color: #2e6b2e; }

/* Specific block positions (percentages of the stage) */
.block.pos-regels   { left: 22%; top: 4%;  width: 20%; min-height: 60px; }
.block.pos-doel     { left: 58%; top: 4%;  width: 20%; min-height: 60px; }
.block.pos-start    { left: 6%;  top: 26%; width: 20%; min-height: 60px; }
.block.pos-einde    { left: 74%; top: 26%; width: 20%; min-height: 60px; }
.block.pos-input    { left: 6%;  top: 48%; width: 20%; min-height: 60px; }
.block.pos-output   { left: 74%; top: 48%; width: 20%; min-height: 60px; }
.block.pos-stake    { left: 6%;  top: 72%; width: 20%; min-height: 60px; }
.block.pos-verant   { left: 33%; top: 72%; width: 20%; min-height: 60px; }
.block.pos-res      { left: 58%; top: 72%; width: 20%; min-height: 60px; }
.block.pos-klanten  { left: 74%; top: 72%; width: 20%; min-height: 60px; }

.block-label {
    font-weight: 700;
    font-size: 13px;
    text-transform: none;
    letter-spacing: 0.01em;
    outline: none;
    text-align: center;
}
.block-text {
    font-size: 11.5px;
    line-height: 1.35;
    outline: none;
    white-space: pre-wrap;
    flex: 1;
    text-align: center;
}
.block-text:empty::before,
.block-label:empty::before { content: "typ hier"; opacity: .5; }

/* Block actions */
.block .actions {
    position: absolute;
    top: -9px; right: -9px;
    display: none; gap: 4px;
}
.block:hover .actions,
.block:focus-within .actions { display: flex; }
.block .actions button {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 1px solid #111;
    background: white;
    cursor: pointer;
    padding: 0;
    font-size: 12px;
    line-height: 1;
}
.block .actions .tone-btn[data-tone="yellow"] { background: #eaf24a; }
.block .actions .tone-btn[data-tone="blue"]   { background: #4aa3d9; }
.block .actions .tone-btn[data-tone="teal"]   { background: #33c6c6; }
.block .actions .tone-btn[data-tone="green"]  { background: #7fc97f; }
.block .actions .del { color: #a00; }

/* CENTER PROCESS SHAPE — pointed on both sides (hexagon arrow) */
.process-shape {
    position: absolute;
    left: 30%;
    top: 39%;
    width: 40%;
    height: 20%;
    z-index: 1;
    background: #eaf24a;
    border: 1.5px solid #6a7200;
    /* chevron/hexagon arrow: 6-point polygon */
    clip-path: polygon(
        6% 0%,
        94% 0%,
        100% 50%,
        94% 100%,
        6% 100%,
        0% 50%
    );
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
}
.process-shape[data-tone="blue"]   { background: #4aa3d9; border-color: #1f3b57; }
.process-shape[data-tone="teal"]   { background: #33c6c6; border-color: #0b5c5c; }
.process-shape[data-tone="green"]  { background: #7fc97f; border-color: #2e6b2e; }

.process-text {
    outline: none;
    font-weight: 700;
    font-size: 16px;
    text-align: center;
    padding: 0 20px;
    color: #111;
}
.process-text:empty::before { content: "typ hier"; opacity: .5; }
.process-shape[data-tone="blue"] .process-text { color: #fff; }

/* Process shape actions */
.process-shape .actions {
    position: absolute;
    top: -9px; right: -9px;
    display: none; gap: 4px;
    z-index: 3;
}
.process-shape:hover .actions,
.process-shape:focus-within .actions { display: flex; }
.process-shape .actions button {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 1px solid #111;
    background: white;
    cursor: pointer;
    padding: 0;
    font-size: 12px;
    line-height: 1;
}
.process-shape .actions .tone-btn[data-tone="yellow"] { background: #eaf24a; }
.process-shape .actions .tone-btn[data-tone="blue"]   { background: #4aa3d9; }
.process-shape .actions .tone-btn[data-tone="teal"]   { background: #33c6c6; }
.process-shape .actions .tone-btn[data-tone="green"]  { background: #7fc97f; }

/* Extras section */
.extras {
    margin-top: 24px;
    padding-top: 14px;
    border-top: 1px dashed #ddd;
}
.extras-label {
    font-size: 12px; color: #888; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 0.05em;
}
.extras-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
}
.extras .block {
    position: relative;
    left: auto; top: auto; width: auto;
}

.add-block-btn {
    margin-top: 16px;
    padding: 8px 14px;
    background: white;
    color: #0066ff;
    border: 1px dashed #0066ff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
}
.add-block-btn:hover { background: #f0f6ff; }

.bar { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 1200px; margin-left: auto; margin-right: auto; }
.bar button {
    font: inherit; font-size: 14px; padding: 9px 16px;
    border-radius: 6px; cursor: pointer; border: 1px solid #ccc;
    background: white; color: #a00;
}
.bar button:hover { background: #fff0f0; border-color: #a00; }

/* Responsive: on narrow screens, fall back to a simple stacked layout */
@media (max-width: 900px) {
    .turtle-stage {
        aspect-ratio: auto;
        min-height: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        position: static;
    }
    .turtle-stage svg.arrows { display: none; }
    .block {
        position: static !important;
        width: 100% !important;
        left: auto !important; top: auto !important;
    }
    .process-shape {
        position: static;
        clip-path: none;
        border-radius: 8px;
        width: 100%;
        height: auto;
        padding: 16px;
    }
}
</style>
</head>
<body>

<div class="topbar" id="topbar" style="display:none">
    <a href="index.html">← Home</a>
    <div class="right">
        <span class="sync" id="sync"><span class="dot"></span><span id="sync-text">Verbonden</span></span>
        <span class="user-email" id="user-email"></span>
        <button id="logout-btn">Log Out</button>
    </div>
</div>

<h1>Turtle Diagrams</h1>
<p class="hint">Klik op een blok om de tekst aan te passen. Beweeg over een blok om de kleur te wijzigen of te verwijderen. Gebruik de pijltjes om tussen diagrammen te wisselen. Wijzigingen worden direct gedeeld met je team.</p>

<div class="nav-bar" id="nav-bar" style="display:none">
    <button class="nav-btn" id="prev-btn" aria-label="Vorige">‹</button>
    <span class="page-indicator" id="page-indicator">Pagina 1 / 2</span>
    <button class="nav-btn" id="next-btn" aria-label="Volgende">›</button>
</div>

<div id="diagram-container"></div>

<div class="bar" id="bottom-bar" style="display:none">
    <button id="reset">Reset voor hele team</button>
</div>

<script src="supabaseClient.js"></script>
<script>
(async () => {
    /* ---------- 1. Auth ---------- */
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }

    document.getElementById('topbar').style.display = 'flex';
    document.getElementById('nav-bar').style.display = 'flex';
    document.getElementById('bottom-bar').style.display = 'flex';
    document.getElementById('user-email').textContent = session.user.email;
    document.getElementById('logout-btn').addEventListener('click', async () => {
        await sb.auth.signOut();
        window.location.href = 'login.html';
    });

    /* ---------- 2. Defaults ---------- */
    const PAGES = ['page1', 'page2'];

    const DEFAULTS = {
        page1: {
            title: "Page 1 - Produceren",
            center: "Proces",
            badge: "A",
            blocks: [
                { id: "regels",  label: "Regels",              text: "Werken in een steriele productieomgeving, veiligheidsregels respecteren, productie volgens standaard werkinstructies", tone: "yellow" },
                { id: "doel",    label: "Doel",                text: "Mycelium verpakkingen produceren volgens de vereiste hoeveelheid en kwaliteit", tone: "yellow" },
                { id: "start",   label: "Start",               text: "Grondstoffen zijn beschikbaar en voorbereid, omgeving is klaar voor productieactiviteiten", tone: "yellow" },
                { id: "einde",   label: "Einde",               text: "Productiebatch is gegenereerd en klaar voor kwaliteitscontrole", tone: "yellow" },
                { id: "input",   label: "Input",               text: "Koffiedik en afval / grondstoffen, productieplanning", tone: "yellow" },
                { id: "output",  label: "Output",              text: "Geproduceerde mycelium verpakking / productiebatch", tone: "yellow" },
                { id: "stake",   label: "Stakeholders",        text: "Productiemedewerkers in Vorst, Microbiologen & kwaliteitslaboranten, Proces- en productie-ingenieurs", tone: "yellow" },
                { id: "verant",  label: "Verantwoordelijke",   text: "Productiemedewerkers in Vorst", tone: "yellow" },
                { id: "res",     label: "Resources",           text: "Fabriek in Vorst, productieomgeving, microbiologische kennis, productiemedewerkers", tone: "yellow" },
                { id: "klanten", label: "Klanten",             text: "Kwaliteitscontrole / volgende stap in het productieproces", tone: "yellow" }
            ]
        },
        page2: {
            title: "Page 2 - Kwaliteitscontrole",
            center: "Proces",
            badge: "B",
            blocks: [
                { id: "regels",  label: "Regels",              text: "Controle volgens het kwaliteitshandboek en de vastgelegde criteria, veiligheidsregels respecteren. Afwijkingen verplicht registreren", tone: "teal" },
                { id: "doel",    label: "Doel",                text: "Kwaliteit van de productiebatch controleren en afwijkingen detecteren", tone: "teal" },
                { id: "start",   label: "Start",               text: "Productiebatch is gegenereerd", tone: "teal" },
                { id: "einde",   label: "Einde",               text: "Batch is goedgekeurd en resultaat is vastgelegd", tone: "teal" },
                { id: "input",   label: "Input",               text: "Geproduceerde productiebatch + productiegegevens, kwaliteitscriteria", tone: "teal" },
                { id: "output",  label: "Output",              text: "Kwaliteitsresultaat / geregistreerde afwijking", tone: "teal" },
                { id: "stake",   label: "Stakeholders",        text: "Productiemedewerkers in Vorst, Microbiologen & kwaliteitslaboranten", tone: "teal" },
                { id: "verant",  label: "Verantwoordelijke",   text: "Microbiologen & kwaliteitslaboranten", tone: "teal" },
                { id: "res",     label: "Resources",           text: "Kwaliteitscontrole, proces-ingenieurs, productiedashboard, batchregistratie, Controle-harnais, Weegschaal en meetinstrumenten", tone: "teal" },
                { id: "klanten", label: "Klanten",             text: "Productiemedewerkers / verdere productie- of leveringsstap", tone: "teal" }
            ]
        }
    };

    /* ---------- 3. State ---------- */
    let state = JSON.parse(JSON.stringify(DEFAULTS));
    let currentPage = 0;
    let focused = null;

    const syncEl = document.getElementById('sync');
    const syncText = document.getElementById('sync-text');
    function setSync(s, t) { syncEl.className = 'sync ' + s; syncText.textContent = t; }

    /* ---------- 4. Load ---------- */
    async function loadAll() {
        const { data, error } = await sb.from('turtle_state').select('*');
        if (error) { setSync('error', 'Laadfout: ' + error.message); return; }

        if (!data || data.length === 0) {
            const rows = PAGES.map(id => ({
                id,
                title: DEFAULTS[id].title,
                center: DEFAULTS[id].center,
                blocks: DEFAULTS[id].blocks,
                updated_by: session.user.id
            }));
            const { error: seedErr } = await sb.from('turtle_state').insert(rows);
            if (seedErr) setSync('error', 'Seed-fout: ' + seedErr.message);
            else setSync('saved', 'Opgeslagen');
        } else {
            data.forEach(row => {
                state[row.id] = {
                    title: row.title,
                    center: row.center,
                    badge: DEFAULTS[row.id]?.badge || '?',
                    blocks: row.blocks
                };
            });
            setSync('saved', 'Opgeslagen');
        }
    }

    /* ---------- 5. Save ---------- */
    const saveTimers = {};
    function queueSave(pageId) {
        setSync('saving', 'Opslaan…');
        clearTimeout(saveTimers[pageId]);
        saveTimers[pageId] = setTimeout(async () => {
            const { error } = await sb.from('turtle_state').upsert({
                id: pageId,
                title: state[pageId].title,
                center: state[pageId].center,
                blocks: state[pageId].blocks,
                updated_at: new Date().toISOString(),
                updated_by: session.user.id
            }, { onConflict: 'id' });
            if (error) setSync('error', 'Fout: ' + error.message);
            else setSync('saved', 'Opgeslagen');
        }, 600);
    }

    /* ---------- 6. Fixed positions ---------- */
    // Each default block id gets a CSS class with absolute position.
    const POSITIONS = {
        regels:  'pos-regels',
        doel:    'pos-doel',
        start:   'pos-start',
        einde:   'pos-einde',
        input:   'pos-input',
        output:  'pos-output',
        stake:   'pos-stake',
        verant:  'pos-verant',
        res:     'pos-res',
        klanten: 'pos-klanten'
    };
    const KNOWN = Object.keys(POSITIONS);

    /* ---------- 7. Render ---------- */
    function renderDiagram() {
        const container = document.getElementById('diagram-container');
        container.innerHTML = '';

        const pageId = PAGES[currentPage];
        const page = state[pageId];
        const pageNum = currentPage + 1;

        const card = document.createElement('div');
        card.className = 'diagram-card page-' + pageNum;

        const badge = document.createElement('div');
        badge.className = 'page-badge';
        badge.textContent = page.badge || '?';
        card.appendChild(badge);

        // Title
        const title = document.createElement('div');
        title.className = 'diagram-title';
        title.contentEditable = 'true';
        title.textContent = page.title;
        title.addEventListener('focus', () => { focused = { page: pageId, field: 'title' }; });
        title.addEventListener('blur',  () => { focused = null; });
        title.addEventListener('input', () => { page.title = title.textContent; queueSave(pageId); });
        card.appendChild(title);

        // Turtle stage (absolute positioning + SVG arrows)
        const stage = document.createElement('div');
        stage.className = 'turtle-stage';

        // SVG layer
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'arrows');
        // Arrowhead marker
        const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
        defs.innerHTML = `
            <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <polygon class="arrowhead" points="0,0 10,5 0,10" />
            </marker>`;
        svg.appendChild(defs);
        stage.appendChild(svg);

        // Center process shape
        const processEl = buildProcessShape(pageId, page);
        stage.appendChild(processEl);

        // Default blocks (each absolutely positioned via CSS class)
        KNOWN.forEach(id => {
            const b = page.blocks.find(x => x.id === id);
            if (!b) return;
            const el = buildBlock(pageId, b);
            el.classList.add(POSITIONS[id]);
            stage.appendChild(el);
        });

        // Custom (extra) blocks go into an extras section below
        const customs = page.blocks.filter(b => !KNOWN.includes(b.id));
        if (customs.length > 0) {
            const extras = document.createElement('div');
            extras.className = 'extras';
            extras.innerHTML = '<div class="extras-label">Extra blokken</div>';
            const eg = document.createElement('div');
            eg.className = 'extras-grid';
            customs.forEach(b => eg.appendChild(buildBlock(pageId, b)));
            extras.appendChild(eg);
            card.appendChild(extras);
        }

        card.appendChild(stage);

        // Add-block button
        const addBtn = document.createElement('button');
        addBtn.className = 'add-block-btn';
        addBtn.textContent = '+ Blok toevoegen';
        addBtn.addEventListener('click', () => {
            const id = 'custom_' + Date.now();
            const tone = (page.blocks[0] && page.blocks[0].tone) || 'yellow';
            page.blocks.push({ id, label: 'Nieuw blok', text: '', tone });
            queueSave(pageId);
            renderDiagram();
        });
        card.appendChild(addBtn);

        container.appendChild(card);

        // Nav
        document.getElementById('page-indicator').textContent =
            `Pagina ${currentPage + 1} / ${PAGES.length}`;
        document.getElementById('prev-btn').disabled = currentPage === 0;
        document.getElementById('next-btn').disabled = currentPage === PAGES.length - 1;

        // Draw arrows once the layout has settled
        requestAnimationFrame(() => drawArrows(svg, stage));
    }

    function buildProcessShape(pageId, page) {
        const el = document.createElement('div');
        el.className = 'process-shape';
        el.dataset.tone = (page.blocks[0] && page.blocks[0].tone) || 'yellow';

        // Actions
        const actions = document.createElement('div');
        actions.className = 'actions';
        ['yellow', 'blue', 'teal', 'green'].forEach(tone => {
            const tb = document.createElement('button');
            tb.className = 'tone-btn';
            tb.dataset.tone = tone;
            tb.title = 'Kleur: ' + tone;
            tb.addEventListener('click', (e) => {
                e.stopPropagation();
                // Change all blocks to match the process for consistency
                page.blocks.forEach(b => b.tone = tone);
                queueSave(pageId);
                renderDiagram();
            });
            actions.appendChild(tb);
        });
        el.appendChild(actions);

        const span = document.createElement('span');
        span.className = 'process-text';
        span.contentEditable = 'true';
        span.textContent = page.center;
        span.addEventListener('focus', () => { focused = { page: pageId, field: 'center' }; });
        span.addEventListener('blur',  () => { focused = null; });
        span.addEventListener('input', () => { page.center = span.textContent; queueSave(pageId); });
        el.appendChild(span);

        return el;
    }

    function buildBlock(pageId, block) {
        const el = document.createElement('div');
        el.className = 'block';
        el.dataset.tone = block.tone || 'yellow';

        const actions = document.createElement('div');
        actions.className = 'actions';
        ['yellow', 'blue', 'teal', 'green'].forEach(tone => {
            const tb = document.createElement('button');
            tb.className = 'tone-btn';
            tb.dataset.tone = tone;
            tb.title = 'Kleur: ' + tone;
            tb.addEventListener('click', (e) => {
                e.stopPropagation();
                block.tone = tone;
                queueSave(pageId);
                renderDiagram();
            });
            actions.appendChild(tb);
        });
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '×';
        del.title = 'Verwijder blok';
        del.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!confirm('Dit blok verwijderen?')) return;
            const page = state[pageId];
            page.blocks = page.blocks.filter(b => b.id !== block.id);
            queueSave(pageId);
            renderDiagram();
        });
        actions.appendChild(del);
        el.appendChild(actions);

        const labelEl = document.createElement('div');
        labelEl.className = 'block-label';
        labelEl.contentEditable = 'true';
        labelEl.textContent = block.label;
        labelEl.addEventListener('focus', () => { focused = { page: pageId, blockId: block.id, field: 'label' }; });
        labelEl.addEventListener('blur',  () => { focused = null; });
        labelEl.addEventListener('input', () => { block.label = labelEl.textContent; queueSave(pageId); });
        el.appendChild(labelEl);

        const textEl = document.createElement('div');
        textEl.className = 'block-text';
        textEl.contentEditable = 'true';
        textEl.textContent = block.text;
        textEl.addEventListener('focus', () => { focused = { page: pageId, blockId: block.id, field: 'text' }; });
        textEl.addEventListener('blur',  () => { focused = null; });
        textEl.addEventListener('input', () => { block.text = textEl.textContent; queueSave(pageId); });
        el.appendChild(textEl);

        return el;
    }

    /* ---------- 8. Arrows (from block edges to the process shape edges) ---------- */
    function drawArrows(svg, stage) {
        const stageRect = stage.getBoundingClientRect();
        const processEl = stage.querySelector('.process-shape');
        if (!processEl) return;

        svg.setAttribute('viewBox', `0 0 ${stageRect.width} ${stageRect.height}`);
        svg.setAttribute('width',  stageRect.width);
        svg.setAttribute('height', stageRect.height);

        const pRect = processEl.getBoundingClientRect();
        // Anchor points on the process shape (relative to stage)
        const pLeft   = { x: pRect.left - stageRect.left,                 y: pRect.top - stageRect.top + pRect.height / 2 };
        const pRight  = { x: pRect.right - stageRect.left,                y: pRect.top - stageRect.top + pRect.height / 2 };
        const pTopL   = { x: pRect.left - stageRect.left + pRect.width * 0.3,  y: pRect.top - stageRect.top };
        const pTopR   = { x: pRect.left - stageRect.left + pRect.width * 0.7,  y: pRect.top - stageRect.top };
        const pBotL   = { x: pRect.left - stageRect.left + pRect.width * 0.35, y: pRect.bottom - stageRect.top };
        const pBotM   = { x: pRect.left - stageRect.left + pRect.width * 0.5,  y: pRect.bottom - stageRect.top };
        const pBotR   = { x: pRect.left - stageRect.left + pRect.width * 0.65, y: pRect.bottom - stageRect.top };

        // Which edge of the process each block connects to
        const CONNECTIONS = {
            regels:  { anchor: pTopL, side: 'bottom' },
            doel:    { anchor: pTopR, side: 'bottom' },
            start:   { anchor: pLeft, side: 'right'  },
            input:   { anchor: pLeft, side: 'right'  },
            stake:   { anchor: pBotL, side: 'top'    },
            verant:  { anchor: pBotM, side: 'top'    },
            res:     { anchor: pBotR, side: 'top'    },
            output:  { anchor: pRight, side: 'left'  }
            // einde and klanten have NO arrow
        };

        Object.entries(CONNECTIONS).forEach(([id, cfg]) => {
            const blockEl = stage.querySelector(`.block[data-block-id="${id}"]`);
            if (!blockEl) return;
            const r = blockEl.getBoundingClientRect();

            // Source point on the block edge
            let sx, sy;
            switch (cfg.side) {
                case 'right':  sx = r.right - stageRect.left; sy = r.top - stageRect.top + r.height / 2; break;
                case 'left':   sx = r.left  - stageRect.left; sy = r.top - stageRect.top + r.height / 2; break;
                case 'top':    sx = r.left  - stageRect.left + r.width / 2; sy = r.top - stageRect.top; break;
                case 'bottom':
                default:       sx = r.left  - stageRect.left + r.width / 2; sy = r.bottom - stageRect.top; break;
            }

            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', sx);
            line.setAttribute('y1', sy);
            line.setAttribute('x2', cfg.anchor.x);
            line.setAttribute('y2', cfg.anchor.y);
            line.setAttribute('marker-end', 'url(#arrowhead)');
            svg.appendChild(line);
        });

        // Arrow from Output down to Klanten
        const outputEl  = stage.querySelector(`.block[data-block-id="output"]`);
        const klantenEl = stage.querySelector(`.block[data-block-id="klanten"]`);
        if (outputEl && klantenEl) {
            const rO = outputEl.getBoundingClientRect();
            const rK = klantenEl.getBoundingClientRect();
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', rO.left - stageRect.left + rO.width * 0.5);
            line.setAttribute('y1', rO.bottom - stageRect.top);
            line.setAttribute('x2', rK.left - stageRect.left + rK.width * 0.5);
            line.setAttribute('y2', rK.top - stageRect.top);
            line.setAttribute('marker-end', 'url(#arrowhead)');
            svg.appendChild(line);
        }
    }

    /* ---------- 9. Navigation ---------- */
    document.getElementById('prev-btn').addEventListener('click', () => {
        if (currentPage > 0) { currentPage--; renderDiagram(); }
    });
    document.getElementById('next-btn').addEventListener('click', () => {
        if (currentPage < PAGES.length - 1) { currentPage++; renderDiagram(); }
    });
    document.addEventListener('keydown', (e) => {
        if (document.activeElement && document.activeElement.isContentEditable) return;
        if (e.key === 'ArrowLeft'  && currentPage > 0) { currentPage--; renderDiagram(); }
        if (e.key === 'ArrowRight' && currentPage < PAGES.length - 1) { currentPage++; renderDiagram(); }
    });
    window.addEventListener('resize', () => {
        const svg = document.querySelector('.arrows');
        const stage = document.querySelector('.turtle-stage');
        if (svg && stage) drawArrows(svg, stage);
    });

    /* ---------- 10. Realtime ---------- */
    function subscribeRealtime() {
        sb.channel('turtle-updates')
            .on('postgres_changes',
                { event: '*', schema: 'public', table: 'turtle_state' },
                (payload) => {
                    const row = payload.new || payload.old;
                    if (!row || !row.id) return;
                    if (row.updated_by && row.updated_by === session.user.id
                        && focused && focused.page === row.id) return;

                    state[row.id] = {
                        title: row.title,
                        center: row.center,
                        badge: DEFAULTS[row.id]?.badge || '?',
                        blocks: row.blocks
                    };
                    if (PAGES[currentPage] === row.id) renderDiagram();
                    setSync('saved', 'Bijgewerkt');
                })
            .subscribe();
    }

    /* ---------- 11. Reset ---------- */
    document.getElementById('reset').onclick = async () => {
        if (!confirm('Alle turtle diagrams resetten naar de beginwaarden voor het hele team?')) return;
        setSync('saving', 'Resetten…');
        const rows = PAGES.map(id => ({
            id,
            title: DEFAULTS[id].title,
            center: DEFAULTS[id].center,
            blocks: DEFAULTS[id].blocks,
            updated_at: new Date().toISOString(),
            updated_by: session.user.id
        }));
        const { error } = await sb.from('turtle_state').upsert(rows, { onConflict: 'id' });
        if (error) { setSync('error', 'Resetfout: ' + error.message); return; }
        state = JSON.parse(JSON.stringify(DEFAULTS));
        renderDiagram();
        setSync('saved', 'Gerest');
    };

    /* ---------- 12. Boot ---------- */
    setSync('saving', 'Laden…');
    await loadAll();
    renderDiagram();
    subscribeRealtime();
})();
</script>
</body>
</html>
