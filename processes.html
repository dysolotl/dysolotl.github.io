<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Processen - PermaFungi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: #f5f6f8;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    padding: 24px;
}
h1 { font-size: clamp(24px, 3vw, 32px); font-weight: 600; margin: 0 0 6px; text-align: center; }
.hint { color: #666; font-size: 14px; margin: 0 auto 24px; line-height: 1.5; text-align: center; max-width: 800px; }

/* Topbar */
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.topbar a { color: #0066ff; text-decoration: none; font-size: 14px; }
.topbar a:hover { text-decoration: underline; }
.topbar .right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.user-email { font-size: 14px; color: #666; }
#logout-btn { padding: 8px 16px; border: 1px solid #ccc; background: white; border-radius: 6px; cursor: pointer; font-size: 14px; color: #222; }
#logout-btn:hover { background: #eee; }

.sync { font-size: 12px; color: #666; display: flex; align-items: center; gap: 6px; background: white; padding: 5px 10px; border-radius: 999px; border: 1px solid #e3e5e8; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: #bbb; transition: background .2s; }
.sync.saving .dot { background: #f0a500; }
.sync.saved  .dot { background: #19a974; }
.sync.error  .dot { background: #d33; }

/* 2×2 grid */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
}
@media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }

.cell {
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    border-top: 4px solid #4aa3d9;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 240px;
}
.cell[data-theme="primary"]    { border-top-color: #4aa3d9; }
.cell[data-theme="support"]    { border-top-color: #7fc97f; }
.cell[data-theme="management"] { border-top-color: #f0a500; }
.cell[data-theme="strategic"]  { border-top-color: #c060d0; }

.cell-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}
.cell-title { font-size: 17px; font-weight: 600; }
.cell[data-theme="primary"]    .cell-title { color: #2c6d9c; }
.cell[data-theme="support"]    .cell-title { color: #2e6b2e; }
.cell[data-theme="management"] .cell-title { color: #7f6000; }
.cell[data-theme="strategic"]  .cell-title { color: #7a3f9e; }

.cell-count {
    font-size: 12px;
    color: #999;
    background: #f3f4f6;
    padding: 3px 8px;
    border-radius: 999px;
}

/* Items list */
.items {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
}
.item {
    position: relative;
    background: #f7f9fc;
    border: 1px solid #dbe4ee;
    border-left: 3px solid #4aa3d9;
    padding: 8px 32px 8px 12px;
    font-size: 14px;
    line-height: 1.35;
    color: #222;
    border-radius: 4px;
}
.cell[data-theme="primary"]    .item { border-left-color: #4aa3d9; }
.cell[data-theme="support"]    .item { border-left-color: #7fc97f; }
.cell[data-theme="management"] .item { border-left-color: #f0a500; }
.cell[data-theme="strategic"]  .item { border-left-color: #c060d0; }

.item span {
    display: block;
    outline: none;
    word-break: break-word;
}
.item span:empty::before { content: "typ hier"; opacity: .45; }

.item .del {
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid #d33;
    background: white;
    color: #d33;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
    display: none;
}
.item:hover .del,
.item:focus-within .del { display: block; }
.item .del:hover { background: #fff0f0; }

.no-items {
    font-size: 13px;
    color: #999;
    font-style: italic;
    padding: 8px 0;
}

.add-btn {
    align-self: flex-start;
    padding: 6px 12px;
    border: 1px dashed currentColor;
    background: white;
    color: #0066ff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
}
.cell[data-theme="primary"]    .add-btn { color: #2c6d9c; }
.cell[data-theme="support"]    .add-btn { color: #2e6b2e; }
.cell[data-theme="management"] .add-btn { color: #7f6000; }
.cell[data-theme="strategic"]  .add-btn { color: #7a3f9e; }
.add-btn:hover { background: #f0f6ff; }

.bar { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 1200px; margin-left: auto; margin-right: auto; }
.bar button {
    font: inherit; font-size: 14px; padding: 9px 16px;
    border-radius: 6px; cursor: pointer; border: 1px solid #ccc;
    background: white; color: #a00;
}
.bar button:hover { background: #fff0f0; border-color: #a00; }
</style>
</head>
<body>

<div class="topbar" id="topbar" style="display:none">
    <a href="index.html">← Home</a>
    <div class="right">
        <span class="sync" id="sync"><span class="dot"></span><span id="sync-text">Verbonden</span></span>
        <span class="user-email" id="user-email"></span>
        <button id="logout-btn">Log Out</button>
    </div>
</div>

<h1>Processen</h1>
<p class="hint">Klik op een item om de tekst aan te passen. Gebruik + om een nieuw item toe te voegen, of × om te verwijderen. Plak je meerdere bullets in één keer, dan worden ze automatisch opgesplitst in aparte items.</p>

<div class="grid" id="grid"></div>

<div class="bar" id="bottom-bar" style="display:none">
    <button id="reset">Reset voor hele team</button>
</div>

<script src="supabaseClient.js"></script>
<script>
(async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }

    document.getElementById('topbar').style.display = 'flex';
    document.getElementById('bottom-bar').style.display = 'flex';
    document.getElementById('user-email').textContent = session.user.email;
    document.getElementById('logout-btn').addEventListener('click', async () => {
        await sb.auth.signOut();
        window.location.href = 'login.html';
    });

    /* ---------- 1. Categories & defaults ---------- */
    const CATEGORIES = [
        { key: 'primary',    theme: 'primary',    label: 'Primaire case processen' },
        { key: 'support',    theme: 'support',    label: 'Support case processen' },
        { key: 'management', theme: 'management', label: 'Management processen' },
        { key: 'strategic',  theme: 'strategic',  label: 'Strategische processen' }
    ];

    const DEFAULTS = {
        primary:    [],
        support:    [],
        management: [],
        strategic:  []
    };

    let state = JSON.parse(JSON.stringify(DEFAULTS));
    let focused = null;

    const syncEl = document.getElementById('sync');
    const syncText = document.getElementById('sync-text');
    function setSync(s, t) { syncEl.className = 'sync ' + s; syncText.textContent = t; }

    /* ---------- 2. Load ---------- */
    async function loadAll() {
        const { data, error } = await sb.from('processes_state').select('key, value');
        if (error) { setSync('error', 'Laadfout: ' + error.message); return; }

        if (!data || data.length === 0) {
            const rows = CATEGORIES.map(c => ({
                key: c.key, value: DEFAULTS[c.key], updated_by: session.user.id
            }));
            const { error: seedErr } = await sb.from('processes_state').insert(rows);
            if (seedErr) setSync('error', 'Seed-fout: ' + seedErr.message);
            else setSync('saved', 'Opgeslagen');
        } else {
            data.forEach(row => { state[row.key] = row.value; });
            setSync('saved', 'Opgeslagen');
        }
    }

    /* ---------- 3. Save (debounced) ---------- */
    const saveTimers = {};
    function queueSave(key) {
        setSync('saving', 'Opslaan…');
        clearTimeout(saveTimers[key]);
        saveTimers[key] = setTimeout(async () => {
            const { error } = await sb.from('processes_state').upsert({
                key, value: state[key],
                updated_at: new Date().toISOString(),
                updated_by: session.user.id
            }, { onConflict: 'key' });
            if (error) setSync('error', 'Fout: ' + error.message);
            else setSync('saved', 'Opgeslagen');
        }, 600);
    }

    /* ---------- 4. Paste splitting ---------- */
    // Splits raw text into individual items using a range of separators:
    // newlines, bullet chars (– — • ▪ * ·), hyphen-space, numbered lists (1. 2.),
    // and the pattern "capital-letter-start after . " when a period is present.
    function splitIntoItems(raw) {
        if (!raw) return [];
        let s = String(raw).replace(/\r\n?/g, '\n');

        // Split on newlines first
        let parts = s.split('\n');

        // Split each chunk on inline bullet markers + numbered-list prefixes
        parts = parts.flatMap(p => p.split(/\s*(?:[–—•▪*·])+\s*|\s+[-]\s+|\s+\d+[.)]\s+/g));

        // Trim and filter empties
        return parts.map(p => p.trim()).filter(Boolean);
    }

    /* ---------- 5. Render ---------- */
    function render() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        CATEGORIES.forEach(cat => grid.appendChild(buildCell(cat)));
    }

    function buildCell(cat) {
        const items = state[cat.key] || [];

        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.theme = cat.theme;
        cell.dataset.key = cat.key;

        const header = document.createElement('div');
        header.className = 'cell-header';
        const title = document.createElement('div');
        title.className = 'cell-title';
        title.textContent = cat.label;
        header.appendChild(title);

        const count = document.createElement('span');
        count.className = 'cell-count';
        count.textContent = items.length + (items.length === 1 ? ' item' : ' items');
        header.appendChild(count);
        cell.appendChild(header);

        if (items.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'no-items';
            empty.textContent = 'Nog geen items. Voeg er een toe!';
            cell.appendChild(empty);
        } else {
            const ul = document.createElement('ul');
            ul.className = 'items';
            items.forEach((text, i) => ul.appendChild(buildItem(cat.key, i, text)));
            cell.appendChild(ul);
        }

        const addBtn = document.createElement('button');
        addBtn.className = 'add-btn';
        addBtn.textContent = '+ Item toevoegen';
        addBtn.addEventListener('click', () => {
            state[cat.key].push('');
            queueSave(cat.key);
            render();
            const newItem = document.querySelector(`.cell[data-key="${cat.key}"] .item:last-child span`);
            if (newItem) newItem.focus();
        });
        cell.appendChild(addBtn);

        return cell;
    }

    function buildItem(key, index, text) {
        const li = document.createElement('li');
        li.className = 'item';

        const span = document.createElement('span');
        span.contentEditable = 'true';
        span.textContent = text;

        span.addEventListener('focus', () => { focused = { key, index }; });
        span.addEventListener('blur',  () => { focused = null; });

        // Paste handler — splits multi-item content into separate items
        span.addEventListener('paste', (e) => {
            e.preventDefault();
            const raw = (e.clipboardData || window.clipboardData).getData('text');
            const chunks = splitIntoItems(raw);
            if (chunks.length === 0) return;

            // Replace current item with first chunk, insert the rest after
            state[key][index] = chunks[0];
            if (chunks.length > 1) {
                state[key].splice(index + 1, 0, ...chunks.slice(1));
            }
            queueSave(key);
            render();

            // Focus back into the first pasted item
            const target = document.querySelector(
                `.cell[data-key="${key}"] .item:nth-child(${index + 1}) span`
            );
            if (target) {
                target.focus();
                const r = document.createRange();
                r.selectNodeContents(target);
                r.collapse(false);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(r);
            }
        });

        span.addEventListener('input', () => {
            state[key][index] = span.textContent;
            queueSave(key);
        });

        span.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                state[key].splice(index + 1, 0, '');
                queueSave(key);
                render();
                const next = document.querySelector(`.cell[data-key="${key}"] .item:nth-child(${index + 2}) span`);
                if (next) next.focus();
            } else if (e.key === 'Backspace' && span.textContent === '' && state[key].length > 1) {
                e.preventDefault();
                state[key].splice(index, 1);
                queueSave(key);
                render();
                const prev = document.querySelector(`.cell[data-key="${key}"] .item:nth-child(${index}) span`);
                if (prev) {
                    prev.focus();
                    const r = document.createRange();
                    r.selectNodeContents(prev);
                    r.collapse(false);
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(r);
                }
            }
        });

        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '×';
        del.title = 'Verwijder item';
        del.addEventListener('click', (e) => {
            e.stopPropagation();
            state[key].splice(index, 1);
            queueSave(key);
            render();
        });

        li.appendChild(span);
        li.appendChild(del);
        return li;
    }

    /* ---------- 6. Realtime ---------- */
    function subscribeRealtime() {
        sb.channel('processes-updates')
            .on('postgres_changes',
                { event: '*', schema: 'public', table: 'processes_state' },
                (payload) => {
                    const row = payload.new || payload.old;
                    if (!row || !row.key) return;

                    if (row.updated_by && row.updated_by === session.user.id) {
                        if (JSON.stringify(state[row.key]) !== JSON.stringify(row.value)) {
                            state[row.key] = row.value;
                            softRerender(row.key);
                        }
                        return;
                    }

                    state[row.key] = row.value;
                    softRerender(row.key);
                })
            .subscribe();
    }

    function softRerender(key) {
        if (focused && focused.key === key) return;
        render();
        setSync('saved', 'Bijgewerkt');
    }

    /* ---------- 7. Reset ---------- */
    document.getElementById('reset').onclick = async () => {
        if (!confirm('Alle processen resetten naar de beginwaarden voor het hele team?')) return;
        setSync('saving', 'Resetten…');
        const rows = CATEGORIES.map(c => ({
            key: c.key, value: DEFAULTS[c.key],
            updated_at: new Date().toISOString(),
            updated_by: session.user.id
        }));
        const { error } = await sb.from('processes_state').upsert(rows, { onConflict: 'key' });
        if (error) { setSync('error', 'Resetfout: ' + error.message); return; }
        state = JSON.parse(JSON.stringify(DEFAULTS));
        render();
        setSync('saved', 'Gerest');
    };

    /* ---------- 8. Boot ---------- */
    setSync('saving', 'Laden…');
    await loadAll();
    render();
    subscribeRealtime();
})();
</script>
</body>
</html>
